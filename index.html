<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ninja Alphabet Adventure</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
}

body{
    background:#08111f;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(circle at 50% 15%, #243b55 0%, #101c2c 42%, #050a12 100%);
}

/* =========================
   NIGHT BACKGROUND
========================= */

.moon{
    position:absolute;
    width:85px;
    height:85px;
    right:8%;
    top:10%;
    border-radius:50%;
    background:#fff4bd;
    box-shadow:
        0 0 25px rgba(255,244,189,.6),
        0 0 60px rgba(255,244,189,.2);
}

.star{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:white;
    opacity:.8;
}

.star1{left:7%;top:13%}
.star2{left:18%;top:27%}
.star3{left:31%;top:9%}
.star4{left:47%;top:18%}
.star5{left:63%;top:8%}
.star6{left:76%;top:28%}
.star7{left:88%;top:16%}
.star8{left:12%;top:43%}
.star9{left:38%;top:32%}
.star10{left:57%;top:38%}
.star11{left:92%;top:42%}

.mountain{
    position:absolute;
    bottom:19%;
    width:0;
    height:0;
    border-left:120px solid transparent;
    border-right:120px solid transparent;
    border-bottom:190px solid #101b2a;
    opacity:.9;
}

.mountain1{left:-80px}
.mountain2{left:25%;transform:scale(1.3)}
.mountain3{right:-80px;transform:scale(.9)}

.ground{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:22%;
    background:
        linear-gradient(
            to bottom,
            #183d24,
            #071a0d
        );
}

/* =========================
   NINJA
========================= */

.ninja{
    position:absolute;
    left:50%;
    top:48%;
    transform:translate(-50%,-50%);
    z-index:40;
    pointer-events:none;
    text-align:center;
    opacity:.95;
}

.ninjaBody{
    position:relative;
    width:95px;
    height:120px;
    margin:auto;
}

.ninjaHead{
    position:absolute;
    width:65px;
    height:65px;
    left:15px;
    top:0;
    background:#111;
    border-radius:50%;
    box-shadow:0 5px 12px rgba(0,0,0,.6);
}

.ninjaMask{
    position:absolute;
    left:8px;
    top:29px;
    width:49px;
    height:18px;
    background:#263238;
    border-radius:5px;
}

.ninjaEye{
    position:absolute;
    top:25px;
    width:9px;
    height:6px;
    background:#fff;
    border-radius:50%;
}

.eye1{left:20px}
.eye2{right:20px}

.ninjaBodyShape{
    position:absolute;
    top:57px;
    left:7px;
    width:81px;
    height:63px;
    background:#111;
    border-radius:35px 35px 15px 15px;
}

.ninjaSword{
    position:absolute;
    width:105px;
    height:7px;
    background:#dfe7ef;
    right:-50px;
    top:48px;
    transform:rotate(-35deg);
    border-radius:5px;
    box-shadow:0 0 8px white;
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    top:8px;
    left:7px;
    right:7px;
    display:flex;
    justify-content:space-between;
    gap:5px;
    z-index:500;
}

.hudBox{
    background:white;
    color:#111;
    border:3px solid #111;
    border-radius:12px;
    padding:6px 9px;
    font-size:13px;
    font-weight:bold;
    box-shadow:0 4px 0 rgba(0,0,0,.3);
}

/* =========================
   TARGET
========================= */

#targetBox{
    position:absolute;
    top:58px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    border:4px solid #111;
    border-radius:18px;
    padding:4px 25px;
    text-align:center;
    z-index:500;
    box-shadow:0 5px 0 rgba(0,0,0,.3);
}

#targetTitle{
    font-size:11px;
    font-weight:bold;
    color:#222;
}

#target{
    font-size:46px;
    line-height:48px;
    font-weight:900;
    color:#e63946;
    text-shadow:2px 2px 0 #222;
}

/* =========================
   LETTER CIRCLES
========================= */

.letter{
    position:absolute;

    width:78px;
    height:78px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff 0%,
            #f4f4f4 45%,
            #c9c9c9 100%
        );

    border:4px solid white;

    box-shadow:
        0 7px 0 rgba(0,0,0,.35),
        0 0 12px rgba(255,255,255,.25);

    overflow:hidden;

    z-index:100;

    user-select:none;
    -webkit-user-select:none;
}

/*
   IMAGE IS THE WHOLE CIRCLE
*/

.letterPicture{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    display:block;

    opacity:0;

    transition:opacity .12s linear;

    pointer-events:none;
}

/*
   If image is not loaded,
   circle remains visible.
*/

.letter.loading{
    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #d9d9d9
        );
}

/* =========================
   HIT
========================= */

.hit{
    animation:
        hitAnimation .22s ease-out forwards;
}

@keyframes hitAnimation{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.3) rotate(12deg);
    }

    100%{
        transform:scale(0);
    }
}

/* =========================
   BOMBS
========================= */

.obstacle{
    position:absolute;
    width:62px;
    height:62px;
    object-fit:contain;
    z-index:120;
    pointer-events:none;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,.55)
        );
}

/* =========================
   MESSAGE
========================= */

#message{
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    z-index:700;
    font-size:50px;
    font-weight:900;
    color:white;
    text-shadow:4px 4px 0 #111;
    opacity:0;
    pointer-events:none;
}

.pop{
    animation:popAnimation .7s ease-out;
}

@keyframes popAnimation{

    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.3);
    }

    35%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.2);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-80%) scale(1);
    }
}

/* =========================
   SLICE
========================= */

.sliceLine{
    position:absolute;
    height:8px;

    background:
        linear-gradient(
            to right,
            transparent,
            white,
            #baf5ff,
            white,
            transparent
        );

    border-radius:20px;

    box-shadow:
        0 0 8px white,
        0 0 18px #70eaff;

    pointer-events:none;
    z-index:800;

    animation:sliceFade .18s ease-out forwards;
}

@keyframes sliceFade{
    from{opacity:1}
    to{opacity:0}
}

/* =========================
   SCREENS
========================= */

.screen{
    position:absolute;
    inset:0;
    z-index:1000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;

    color:white;
}

.screen h1{
    font-size:clamp(40px,10vw,65px);
    text-shadow:4px 4px 0 #111;
}

.screen h2{
    margin:8px 0;
}

.screen p{
    margin:5px;
}

#startScreen{
    background:
        radial-gradient(
            circle at center,
            #263b55,
            #08111f 70%
        );
}

#gameOverScreen{
    background:
        linear-gradient(
            135deg,
            #8b0000,
            #26000a
        );
}

#winScreen{
    background:
        linear-gradient(
            135deg,
            #00695c,
            #073b73
        );
}

/* =========================
   INPUT
========================= */

#playerName{
    width:min(320px,85vw);
    padding:14px;
    margin:18px 0;

    border:3px solid #222;
    border-radius:15px;

    font-size:20px;
    text-align:center;

    color:#222;
    background:white;

    user-select:text;
    -webkit-user-select:text;

    touch-action:auto;
}

/* =========================
   BUTTON
========================= */

.gameButton{
    border:4px solid #222;
    border-radius:20px;

    background:#ffd43b;
    color:#222;

    padding:14px 32px;

    font-size:21px;
    font-weight:bold;

    box-shadow:0 7px 0 #9b7200;

    touch-action:manipulation;
}

.gameButton:active{
    transform:translateY(6px);
    box-shadow:0 1px 0 #9b7200;
}

.hidden{
    display:none !important;
}

@media(max-height:600px){

    #targetBox{
        top:48px;
    }

    .letter{
        width:68px;
        height:68px;
    }

    .obstacle{
        width:54px;
        height:54px;
    }

    .ninja{
        top:50%;
        transform:translate(-50%,-50%) scale(.8);
    }
}
</style>
</head>

<body>

    <div class="star star1"></div>

<script>

/* =========================================
   ALPHABET
========================================= */

const alphabet =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");


/* =========================================
   VARIABLES
========================================= */

let letters = [];
let obstacles = [];
let shuffledAlphabet = [];

let target = "A";

let score = 0;
let lives = 5;
let level = 1;
let currentIndex = 0;
let timeLeft = 10;

let timer = null;
let running = false;

let playerName = "Ninja";

let audioContext = null;

let lastX = 0;
let lastY = 0;


/* =========================================
   ELEMENTS
========================================= */

const game =
document.getElementById("game");

const targetEl =
document.getElementById("target");

const scoreEl =
document.getElementById("score");

const livesEl =
document.getElementById("lives");

const levelEl =
document.getElementById("level");

const timerEl =
document.getElementById("timer");

const message =
document.getElementById("message");

const nameInput =
document.getElementById("playerName");

const startScreen =
document.getElementById("startScreen");

const gameOverScreen =
document.getElementById("gameOverScreen");

const winScreen =
document.getElementById("winScreen");


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array){

    const arr = [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];
    }

    return arr;
}


/* =========================================
   AUDIO
========================================= */

function initAudio(){

    if(!audioContext){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioContext){

            audioContext =
                new AudioContext();
        }
    }

    if(
        audioContext &&
        audioContext.state === "suspended"
    ){

        audioContext.resume();
    }
}


function tone(
    frequency,
    duration,
    type="sine",
    volume=.25
){

    if(!audioContext)return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = type;

    osc.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
        audioContext.currentTime + duration
    );
}


function sliceSound(){

    if(!audioContext)return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "sawtooth";

    osc.frequency.setValueAtTime(
        1800,
        audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        150,
        audioContext.currentTime + .12
    );

    gain.gain.setValueAtTime(
        .3,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + .12
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
        audioContext.currentTime + .12
    );
}


function correctSound(){

    tone(600,.1,"square",.2);

    setTimeout(
        function(){
            tone(900,.14,"square",.2);
        },
        100
    );
}


function wrongSound(){

    tone(
        120,
        .3,
        "sawtooth",
        .35
    );
}


function gameOverSound(){

    tone(180,.35,"sawtooth",.45);

    setTimeout(
        function(){
            tone(120,.45,"sawtooth",.45);
        },
        300
    );

    setTimeout(
        function(){
            tone(70,.7,"sawtooth",.45);
        },
        700
    );
}


/* =========================================
   IMPORTANT IMAGE LOADER
========================================= */

/*
   Each letter is loaded ONCE.

   Example:
   A.jpeg
   A.png
   A.jpg

   The first working file is used.

   No duplicate images.
*/

const imageCache = {};


function getLetterImage(letter){

    const key =
        letter.toUpperCase();

    if(imageCache[key]){
        return imageCache[key];
    }

    const extensions = [
        "jpeg",
        "png",
        "jpg"
    ];

    const promise =
        new Promise(
            function(resolve){

                let index = 0;

                function tryFile(){

                    if(
                        index >=
                        extensions.length
                    ){

                        resolve(null);
                        return;
                    }

                    const ext =
                        extensions[index];

                    index++;

                    const img =
                        new Image();

                    img.onload =
                        function(){

                            resolve(img.src);
                        };

                    img.onerror =
                        function(){

                            tryFile();
                        };

                    img.src =
                        "./" +
                        key +
                        "." +
                        ext +
                        "?v=1";
                }

                tryFile();
            }
        );

    imageCache[key] = promise;

    return promise;
}


/* =========================================
   PRELOAD ALL LETTER IMAGES
========================================= */

function preloadImages(){

    alphabet.forEach(
        function(letter){

            getLetterImage(letter);

        }
    );
}


/* =========================================
   APPLY IMAGE
========================================= */

function setLetterImage(
    letter,
    img,
    circle
){

    getLetterImage(letter)
        .then(
            function(src){

                if(!src){

                    /*
                       Keep circle visible
                       if image is missing.
                    */

                    circle.classList.remove(
                        "loading"
                    );

                    return;
                }

                /*
                   Prevent duplicate image.
                */

                if(
                    img.dataset.loaded === "true"
                ){

                    return;
                }

                img.dataset.loaded = "true";

                img.src = src;

                img.onload =
                    function(){

                        img.style.opacity = "1";

                    };

            }
        );
}


/* =========================================
   LETTER AUDIO
========================================= */

function playLetterSound(letter){

    return new Promise(
        function(resolve){

            const upper =
                letter.toUpperCase();

            const audio =
                new Audio(
                    "./" +
                    upper +
                    ".mp3"
                );

            audio.preload = "auto";
            audio.volume = 1;

            let finished = false;

            function finish(){

                if(finished)return;

                finished = true;

                resolve();
            }

            audio.addEventListener(
                "ended",
                finish,
                {once:true}
            );

            audio.addEventListener(
                "error",
                finish,
                {once:true}
            );

            audio.play()
                .catch(
                    function(){
                        finish();
                    }
                );
        }
    );
}


/* =========================================
   BOMB LOADER
========================================= */

function loadBomb(img){

    const files = [
        "bomb.png",
        "Bomb.png",
        "BOMB.png",
        "bomb.jpeg",
        "Bomb.jpeg",
        "bomb.jpg"
    ];

    let index = 0;

    function next(){

        if(index >= files.length){
            return;
        }

        const file =
            files[index++];

        img.onload =
            function(){

                img.style.display =
                    "block";
            };

        img.onerror =
            function(){

                next();
            };

        img.src =
            "./" +
            file;
    }

    next();
}


/* =========================================
   START GAME
========================================= */

function startGame(){

    initAudio();

    playerName =
        nameInput.value.trim()
        ||
        "Ninja";

    score = 0;
    lives = 5;
    level = 1;
    currentIndex = 0;

    shuffledAlphabet =
        shuffle(alphabet);

    running = true;

    clearInterval(timer);

    clearLetters();
    clearObstacles();

    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    winScreen.classList.add("hidden");

    updateHUD();

    nextRound();
}


/* =========================================
   HUD
========================================= */

function updateHUD(){

    scoreEl.textContent =
        score;

    livesEl.textContent =
        lives;

    levelEl.textContent =
        level;

    timerEl.textContent =
        timeLeft;
}


/* =========================================
   NEXT ROUND
========================================= */

function nextRound(){

    if(!running)return;

    clearInterval(timer);

    clearLetters();
    clearObstacles();

    if(
        currentIndex >=
        shuffledAlphabet.length
    ){

        winGame();
        return;
    }

    const base =
        shuffledAlphabet[
            currentIndex
        ];

    /*
       TARGET ALWAYS CAPITAL
       because the picture contains
       the letter.
    */

    target = base;

    targetEl.textContent =
        target;

    timeLeft =
        Math.max(
            5,
            11 - level
        );

    createLetters();
    createObstacles();

    updateHUD();

    startTimer();

    currentIndex++;

    level =
        Math.min(
            10,
            Math.floor(
                currentIndex / 5
            ) + 1
        );

    updateHUD();
}


/* =========================================
   CREATE LETTERS
========================================= */

function createLetters(){

    const count =
        Math.min(
            6 + Math.floor(level / 2),
            10
        );

    const list = [];

    /*
       ONE target only.
       This prevents duplicate
       target circles.
    */

    list.push(target);

    while(
        list.length < count
    ){

        const wrong =
            alphabet[
                Math.floor(
                    Math.random() *
                    alphabet.length
                )
            ];

        if(
            wrong === target
        ){
            continue;
        }

        if(
            list.includes(wrong)
        ){
            continue;
        }

        list.push(wrong);
    }

    const mixed =
        shuffle(list);

    mixed.forEach(
        function(letter,index){

            createLetter(
                letter,
                index
            );

        }
    );
}


/* =========================================
   CREATE ONE LETTER CIRCLE
========================================= */

function createLetter(
    letter,
    index
){

    const el =
        document.createElement("div");

    el.className =
        "letter loading";

    /*
       IMPORTANT:
       NO LETTER TEXT HERE.
    */

    const img =
        document.createElement("img");

    img.className =
        "letterPicture";

    img.alt = "";

    el.appendChild(img);

    /*
       Keep circles away from
       HUD and target.
    */

    const minY = 155;

    const maxY =
        Math.max(
            minY + 20,
            window.innerHeight - 170
        );

    const maxX =
        Math.max(
            10,
            window.innerWidth - 90
        );

    const obj = {

        el:el,

        display:letter,

        base:letter,

        x:
            10 +
            Math.random() * maxX,

        y:
            minY +
            Math.random() *
            (maxY - minY),

        /*
           Moderate speed.
        */

        vx:
            (
                Math.random() < .5
                ? -1
                : 1
            ) *
            (
                0.9 +
                Math.random() *
                (0.35 + level * .06)
            ),

        vy:
            (
                Math.random() < .5
                ? -1
                : 1
            ) *
            (
                0.7 +
                Math.random() *
                (0.35 + level * .05)
            ),

        rotation:
            Math.random() * 360,

        vr:
            (Math.random() - .5) * 3,

        alive:true
    };

    game.appendChild(el);

    letters.push(obj);

    /*
       Load exactly one image.
    */

    setLetterImage(
        letter,
        img,
        el
    );
}


/* =========================================
   CREATE BOMBS
========================================= */

function createObstacles(){

    /*
       Level 1 = 1 bomb
       Level 2 = 2 bombs
       Level 3+ = 3 bombs
    */

    const count =
        Math.min(level,3);

    for(
        let i=0;
        i<count;
        i++
    ){

        const img =
            document.createElement("img");

        img.className =
            "obstacle";

        img.alt = "";

        loadBomb(img);

        const obj = {

            el:img,

            x:
                20 +
                Math.random() *
                Math.max(
                    20,
                    window.innerWidth - 80
                ),

            y:
                160 +
                Math.random() *
                Math.max(
                    20,
                    window.innerHeight - 310
                ),

            vx:
                (
                    Math.random() < .5
                    ? -1
                    : 1
                ) *
                (
                    .8 +
                    level * .08
                ),

            vy:
                (
                    Math.random() < .5
                    ? -1
                    : 1
                ) *
                (
                    .6 +
                    level * .06
                ),

            rotation:0,

            vr:
                (Math.random()-.5)*5
        };

        game.appendChild(img);

        obstacles.push(obj);
    }
}


/* =========================================
   ANIMATION
========================================= */

function animate(){

    if(running){

        const w =
            window.innerWidth;

        const h =
            window.innerHeight;

        letters.forEach(
            function(obj){

                if(!obj.alive)return;

                obj.x += obj.vx;
                obj.y += obj.vy;
                obj.rotation += obj.vr;

                if(
                    obj.x < 5 ||
                    obj.x > w - 83
                ){

                    obj.vx *= -1;
                }

                if(
                    obj.y < 135 ||
                    obj.y > h - 170
                ){

                    obj.vy *= -1;
                }

                obj.el.style.transform =
                    `
                    translate(
                        ${obj.x}px,
                        ${obj.y}px
                    )
                    rotate(
                        ${obj.rotation}deg
                    )
                    `;
            }
        );

        obstacles.forEach(
            function(obj){

                obj.x += obj.vx;
                obj.y += obj.vy;
                obj.rotation += obj.vr;

                if(
                    obj.x < 5 ||
                    obj.x > w - 70
                ){

                    obj.vx *= -1;
                }

                if(
                    obj.y < 135 ||
                    obj.y > h - 175
                ){

                    obj.vy *= -1;
                }

                obj.el.style.transform =
                    `
                    translate(
                        ${obj.x}px,
                        ${obj.y}px
                    )
                    rotate(
                        ${obj.rotation}deg
                    )
                    `;
            }
        );
    }

    requestAnimationFrame(animate);
}

animate();


/* =========================================
   TIMER
========================================= */

function startTimer(){

    clearInterval(timer);

    timer =
        setInterval(
            function(){

                if(!running)return;

                timeLeft--;

                updateHUD();

                if(
                    timeLeft <= 0
                ){

                    clearInterval(timer);

                    loseLife(
                        "TIME UP!"
                    );
                }

            },
            1000
        );
}


/* =========================================
   POINTER DOWN
========================================= */

game.addEventListener(
    "pointerdown",
    function(e){

        if(
            e.target.closest(".gameButton") ||
            e.target.tagName === "INPUT"
        ){
            return;
        }

        if(!running)return;

        lastX = e.clientX;
        lastY = e.clientY;

        checkCollision(
            e.clientX,
            e.clientY
        );
    }
);


/* =========================================
   POINTER MOVE
========================================= */

game.addEventListener(
    "pointermove",
    function(e){

        if(!running)return;

        drawSlice(
            lastX,
            lastY,
            e.clientX,
            e.clientY
        );

        lastX = e.clientX;
        lastY = e.clientY;

        checkCollision(
            e.clientX,
            e.clientY
        );
    }
);


/* =========================================
   COLLISION
========================================= */

function checkCollision(x,y){

    if(!running)return;

    letters.forEach(
        function(obj){

            if(!obj.alive)return;

            const rect =
                obj.el.getBoundingClientRect();

            const cx =
                rect.left +
                rect.width / 2;

            const cy =
                rect.top +
                rect.height / 2;

            const distance =
                Math.hypot(
                    x-cx,
                    y-cy
                );

            if(distance < 55){

                sliceLetter(obj);
            }
        }
    );

    obstacles.forEach(
        function(obj){

            if(!obj.el.parentNode)return;

            const rect =
                obj.el.getBoundingClientRect();

            const cx =
                rect.left +
                rect.width / 2;

            const cy =
                rect.top +
                rect.height / 2;

            const distance =
                Math.hypot(
                    x-cx,
                    y-cy
                );

            if(distance < 50){

                hitObstacle(obj);
            }
        }
    );
}


/* =========================================
   SLICE LETTER
========================================= */

function sliceLetter(obj){

    if(!obj.alive)return;

    obj.alive = false;

    sliceSound();

    obj.el.classList.add("hit");

    const correct =
        obj.display.toUpperCase() ===
        target.toUpperCase();

    if(correct){

        correctLetter(obj);

    }else{

        wrongLetter();
    }

    setTimeout(
        function(){

            if(obj.el){

                obj.el.remove();
            }

        },
        220
    );
}


/* =========================================
   CORRECT LETTER
========================================= */

async function correctLetter(obj){

    clearInterval(timer);

    correctSound();

    score +=
        10 * level;

    showMessage("GREAT!");

    updateHUD();

    /*
       Voice plays before next letter.
    */

    await playLetterSound(
        obj.base
    );

    if(!running)return;

    setTimeout(
        function(){

            nextRound();

        },
        300
    );
}


/* =========================================
   WRONG LETTER
========================================= */

function wrongLetter(){

    lives--;

    score =
        Math.max(
            0,
            score - 5
        );

    wrongSound();

    showMessage("WRONG!");

    updateHUD();

    if(lives <= 0){

        setTimeout(
            gameOver,
            500
        );
    }
}


/* =========================================
   BOMB HIT
========================================= */

function hitObstacle(obj){

    if(!running)return;

    lives--;

    score =
        Math.max(
            0,
            score - 10
        );

    wrongSound();

    showMessage("OUCH!");

    obj.el.remove();

    obstacles =
        obstacles.filter(
            function(item){
                return item !== obj;
            }
        );

    updateHUD();

    if(lives <= 0){

        setTimeout(
            gameOver,
            500
        );
    }
}


/* =========================================
   SLICE LINE
========================================= */

function drawSlice(
    x1,
    y1,
    x2,
    y2
){

    const dx = x2-x1;
    const dy = y2-y1;

    const length =
        Math.sqrt(
            dx*dx +
            dy*dy
        );

    if(length < 3)return;

    const line =
        document.createElement("div");

    line.className =
        "sliceLine";

    const angle =
        Math.atan2(dy,dx) *
        180 /
        Math.PI;

    line.style.width =
        length + "px";

    line.style.left =
        x1 + "px";

    line.style.top =
        y1 + "px";

    line.style.transform =
        `rotate(${angle}deg)`;

    game.appendChild(line);

    setTimeout(
        function(){
            line.remove();
        },
        180
    );
}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text){

    message.textContent =
        text;

    message.classList.remove("pop");

    void message.offsetWidth;

    message.classList.add("pop");
}


/* =========================================
   LOSE LIFE
========================================= */

function loseLife(reason){

    if(!running)return;

    lives--;

    wrongSound();

    showMessage(reason);

    updateHUD();

    if(lives <= 0){

        setTimeout(
            gameOver,
            500
        );

    }else{

        setTimeout(
            nextRound,
            600
        );
    }
}


/* =========================================
   GAME OVER
========================================= */

function gameOver(){

    if(!running)return;

    running = false;

    clearInterval(timer);

    clearLetters();
    clearObstacles();

    gameOverSound();

    document.getElementById(
        "gameOverName"
    ).textContent =
        playerName;

    document.getElementById(
        "finalScore"
    ).textContent =
        score;

    document.getElementById(
        "finalLevel"
    ).textContent =
        level;

    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =========================================
   WIN
========================================= */

function winGame(){

    running = false;

    clearInterval(timer);

    clearLetters();
    clearObstacles();

    tone(523,.2,"square",.2);

    setTimeout(
        function(){
            tone(659,.2,"square",.2);
        },
        150
    );

    setTimeout(
        function(){
            tone(784,.3,"square",.2);
        },
        300
    );

    document.getElementById(
        "winName"
    ).textContent =
        "Great job, " +
        playerName +
        "!";

    document.getElementById(
        "winScore"
    ).textContent =
        score;

    winScreen.classList.remove(
        "hidden"
    );
}


/* =========================================
   CLEAR LETTERS
========================================= */

function clearLetters(){

    letters.forEach(
        function(obj){

            if(obj.el){
                obj.el.remove();
            }
        }
    );

    letters = [];
}


/* =========================================
   CLEAR BOMBS
========================================= */

function clearObstacles(){

    obstacles.forEach(
        function(obj){

            if(obj.el){
                obj.el.remove();
            }
        }
    );

    obstacles = [];
}


/* =========================================
   BUTTONS
========================================= */

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);

document
.getElementById("againButton")
.addEventListener(
    "click",
    startGame
);

document
.getElementById("winAgainButton")
.addEventListener(
    "click",
    startGame
);


/* =========================================
   ENTER
========================================= */

nameInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            startGame();
        }
    }
);


/* =========================================
   PRELOAD
========================================= */

/*
   Start loading all images immediately,
   before the player reaches them.
*/

preloadImages();

</script>
