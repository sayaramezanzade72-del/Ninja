<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ninja Alphabet Adventure</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
}

body{
    background:#5ed7ff;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        #5ed7ff 0%,
        #c9f5ff 67%,
        #70c94b 67%,
        #439b32 100%
    );
}


/* CLOUDS */

.cloud{
    position:absolute;
    width:120px;
    height:38px;
    background:white;
    border-radius:40px;
    opacity:.75;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:50px;
    height:50px;
    left:15px;
    top:-22px;
}

.cloud:after{
    width:60px;
    height:60px;
    right:10px;
    top:-27px;
}

.cloud1{
    left:5%;
    top:12%;
}

.cloud2{
    right:5%;
    top:23%;
}


/* HUD */

#hud{
    position:absolute;
    top:8px;
    left:7px;
    right:7px;

    display:flex;
    justify-content:space-between;
    gap:5px;

    z-index:500;
}

.hudBox{
    background:white;

    border:3px solid #222;

    border-radius:12px;

    padding:6px 9px;

    font-size:13px;

    font-weight:bold;

    color:#222;

    box-shadow:
        0 4px 0 rgba(0,0,0,.25);
}


/* TARGET */

#targetBox{
    position:absolute;

    top:58px;
    left:50%;

    transform:translateX(-50%);

    background:white;

    border:4px solid #222;

    border-radius:18px;

    padding:4px 25px;

    text-align:center;

    z-index:500;

    box-shadow:
        0 5px 0 rgba(0,0,0,.25);
}

#targetTitle{
    font-size:11px;
    font-weight:bold;
}

#target{
    font-size:46px;

    line-height:48px;

    font-weight:900;

    color:#e63946;

    text-shadow:
        2px 2px 0 #222;
}


/* =====================================
   LETTER CIRCLE
===================================== */

.letter{

    position:absolute;

    width:76px;
    height:76px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    overflow:hidden;

    background:white;

    border:5px solid white;

    box-shadow:
        0 7px 0 rgba(0,0,0,.3),
        inset 0 0 0 3px rgba(0,0,0,.15);

    z-index:100;

    user-select:none;

    -webkit-user-select:none;
}


/* IMAGE INSIDE CIRCLE */

.letterPicture{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    padding:0;

    margin:0;

    border:none;

    background:white;

    display:block;

}


/* HIT */

.hit{

    animation:
        hitAnimation .2s ease-out forwards;
}

@keyframes hitAnimation{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.4)
        rotate(15deg);
    }

    100%{
        transform:scale(0);
    }
}


/* SLICE */

.sliceLine{

    position:absolute;

    height:8px;

    background:
        linear-gradient(
            to right,
            transparent,
            white,
            #baf5ff,
            white,
            transparent
        );

    border-radius:20px;

    box-shadow:
        0 0 8px white,
        0 0 18px #70eaff;

    pointer-events:none;

    z-index:800;

    animation:
        sliceFade .18s
        ease-out forwards;
}

@keyframes sliceFade{

    from{
        opacity:1;
    }

    to{
        opacity:0;
    }
}


/* MESSAGE */

#message{

    position:absolute;

    left:50%;
    top:45%;

    transform:
        translate(-50%,-50%);

    z-index:700;

    font-size:50px;

    font-weight:900;

    color:white;

    text-shadow:
        4px 4px 0 #222;

    opacity:0;

    pointer-events:none;
}

.pop{

    animation:
        popAnimation .7s ease-out;
}

@keyframes popAnimation{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.3);
    }

    35%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.2);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-80%)
            scale(1);
    }
}


/* OBSTACLES */

.obstacle{

    position:absolute;

    width:64px;
    height:64px;

    object-fit:contain;

    z-index:120;

    pointer-events:none;

    filter:
        drop-shadow(
            0 5px 4px
            rgba(0,0,0,.35)
        );
}


/* SCREENS */

.screen{

    position:absolute;

    inset:0;

    z-index:1000;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:20px;

    color:white;
}

.screen h1{

    font-size:
        clamp(40px,10vw,65px);

    text-shadow:
        4px 4px 0 #222;
}

.screen h2{
    margin:8px 0;
}

.screen p{
    margin:5px;
}


/* START */

#startScreen{

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #7c3aed
        );
}


/* GAME OVER */

#gameOverScreen{

    background:
        linear-gradient(
            135deg,
            #e63946,
            #7028a0
        );
}


/* WIN */

#winScreen{

    background:
        linear-gradient(
            135deg,
            #00b894,
            #0984e3
        );
}


/* NAME */

#playerName{

    width:min(320px,85vw);

    padding:14px;

    margin:18px 0;

    border:3px solid #222;

    border-radius:15px;

    font-size:20px;

    text-align:center;

    color:#222;

    background:white;

    user-select:text;

    -webkit-user-select:text;

    touch-action:auto;
}


/* BUTTON */

.gameButton{

    border:4px solid #222;

    border-radius:20px;

    background:#ffd43b;

    color:#222;

    padding:14px 32px;

    font-size:21px;

    font-weight:bold;

    box-shadow:
        0 7px 0 #9b7200;

    touch-action:manipulation;
}

.gameButton:active{

    transform:
        translateY(6px);

    box-shadow:
        0 1px 0 #9b7200;
}

.hidden{
    display:none !important;
}


@media(max-height:600px){

    #targetBox{
        top:48px;
    }

    .letter{
        width:64px;
        height:64px;
    }
}

</style>
</head>


<body>

<div id="game">

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>


    <!-- HUD -->

    <div id="hud">

        <div class="hudBox">
            ⭐ <span id="score">0</span>
        </div>

        <div class="hudBox">
            ❤️ <span id="lives">5</span>
        </div>

        <div class="hudBox">
            LEVEL <span id="level">1</span>
        </div>

        <div class="hudBox">
            ⏱️ <span id="timer">10</span>
        </div>

    </div>


    <!-- TARGET -->

    <div id="targetBox">

        <div id="targetTitle">
            SLICE THIS LETTER
        </div>

        <div id="target">
            A
        </div>

    </div>


    <div id="message"></div>


    <!-- START SCREEN -->

    <div id="startScreen" class="screen">

        <h1>🥷 Ninja</h1>

        <h2>Alphabet Adventure</h2>

        </button>

        id="gameOverScreen"

        <h1>💥 GAME OVER</h1>

        <h2 id="gameOverName"></h2>

        <p>
            Score:
            <strong id="finalScore">0</strong>
        </p>

            Level:

        </p>

            id="againButton"
            class="gameButton"

        class="screen hidden">

        <h2>Excellent Job!</h2>

        <p>
            Score:
            <strong id="winScore">0</strong>
        </p>

        <button
            id="winAgainButton"
            class="gameButton"

            PLAY AGAIN

        </button>

        <p style="margin-top:15px;">
            Ms. Ramezanzadeh
        </p>

    </div>

</div>


<script>

/* =========================================
   ALPHABET
========================================= */

const alphabet =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");


/* =========================================
   VARIABLES
========================================= */

let letters = [];

let obstacles = [];

let shuffledAlphabet = [];

let target = "A";

let score = 0;

let lives = 5;

let level = 1;

let currentIndex = 0;

let timeLeft = 10;

let timer = null;

let running = false;

let playerName = "Ninja";

let audioContext = null;

let lastX = 0;

let lastY = 0;


/* =========================================
   ELEMENTS
========================================= */

const game =
document.getElementById("game");

const targetEl =
document.getElementById("target");

const scoreEl =
document.getElementById("score");

const livesEl =
document.getElementById("lives");

const levelEl =
document.getElementById("level");

const timerEl =
document.getElementById("timer");

const message =
document.getElementById("message");

const nameInput =
document.getElementById("playerName");

const startScreen =
document.getElementById("startScreen");

const gameOverScreen =
document.getElementById("gameOverScreen");

const winScreen =
document.getElementById("winScreen");


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array){

    const arr = [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];
    }

    return arr;
}


/* =========================================
   AUDIO
========================================= */

function initAudio(){

    if(!audioContext){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioContext){

            audioContext =
                new AudioContext();
        }
    }

    if(
        audioContext &&
        audioContext.state === "suspended"
    ){

        audioContext.resume();
    }
}


/* =========================================
   TONE
========================================= */

function tone(
    frequency,
    duration,
    type="sine",
    volume=.25
){

    if(!audioContext)return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = type;

    osc.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime +
        duration
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime +
        duration
    );
}


/* =========================================
   SLICE SOUND
========================================= */

function sliceSound(){

    if(!audioContext)return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type =
        "sawtooth";

    osc.frequency.setValueAtTime(
        1800,
        audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        150,
        audioContext.currentTime +
        .12
    );

    gain.gain.setValueAtTime(
        .35,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime +
        .12
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime +
        .12
    );
}


/* =========================================
   CORRECT SOUND
========================================= */

function correctSound(){

    tone(
        600,
        .1,
        "square",
        .2
    );

    setTimeout(
        function(){

            tone(
                900,
                .14,
                "square",
                .2
            );

        },
        100
    );
}


/* =========================================
   WRONG SOUND
========================================= */

function wrongSound(){

    tone(
        120,
        .3,
        "sawtooth",
        .35
    );
}


/* =========================================
   GAME OVER SOUND
========================================= */

function gameOverSound(){

    tone(
        180,
        .35,
        "sawtooth",
        .45
    );

    setTimeout(
        function(){

            tone(
                120,
                .45,
                "sawtooth",
                .45
            );

        },
        300
    );

    setTimeout(
        function(){

            tone(
                70,
                .7,
                "sawtooth",
                .45
            );

        },
        700
    );
}


/* =========================================
   IMAGE LOADER
========================================= */

function loadLetterImage(
    letter,
    img
){

    const upper =
        letter.toUpperCase();

    const extensions = [
        "jpeg",
        "png",
        "jpg"
    ];

    let index = 0;


    function tryNext(){

        if(
            index >=
            extensions.length
        ){

            console.log(
                "IMAGE NOT FOUND:",
                upper
            );

            img.style.display =
                "none";

            return;
        }


        const filename =
            upper +
            "." +
            extensions[index];

        index++;


        img.onload =
            function(){

                img.style.display =
                    "block";

                console.log(
                    "IMAGE LOADED:",
                    filename
                );
            };


        img.onerror =
            function(){

                tryNext();
            };


        img.src =
            "./" + filename;
    }


    tryNext();
}


/* =========================================
   LETTER VOICE
========================================= */

function playLetterSound(letter){

    const upper =
        letter.toUpperCase();

    const audio =
        new Audio(
            "./" +
            upper +
            ".mp3"
        );

    audio.volume = 1;

    audio.play()
        .then(
            function(){

                console.log(
                    "VOICE PLAYING:",
                    upper + ".mp3"
                );

            }
        )
        .catch(
            function(error){

                console.log(
                    "VOICE ERROR:",
                    upper,
                    error
                );

            }
        );
}


/* =========================================
   OBSTACLE IMAGE
========================================= */

function loadObstacle(
    names,
    img
){

    let index = 0;


    function tryNext(){

        if(
            index >=
            names.length
        ){

            img.style.display =
                "none";

            return;
        }


        const filename =
            names[index];

        index++;


        img.onload =
            function(){

                img.style.display =
                    "block";
            };


        img.onerror =
            function(){

                tryNext();
            };


        img.src =
            "./" +
            filename;
    }


    tryNext();
}


/* =========================================
   START GAME
========================================= */

function startGame(){

    initAudio();

    playerName =
        nameInput.value.trim()
        ||
        "Ninja";

    score = 0;

    lives = 5;

    level = 1;

    currentIndex = 0;

    shuffledAlphabet =
        shuffle(alphabet);

    running = true;

    clearInterval(timer);

    clearLetters();

    clearObstacles();

    startScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );

    winScreen.classList.add(
        "hidden"
    );

    updateHUD();

    nextRound();
}


/* =========================================
   HUD
========================================= */

function updateHUD(){

    scoreEl.textContent =
        score;

    livesEl.textContent =
        lives;

    levelEl.textContent =
        level;

    timerEl.textContent =
        timeLeft;
}


/* =========================================
   NEXT ROUND
========================================= */

function nextRound(){

    if(!running)return;

    clearLetters();

    clearObstacles();


    if(
        currentIndex >=
        shuffledAlphabet.length
    ){

        winGame();

        return;
    }


    const base =
        shuffledAlphabet[
            currentIndex
        ];


    target =
        Math.random() < .5
        ?
        base
        :
        base.toLowerCase();


    targetEl.textContent =
        target;


    timeLeft =
        Math.max(
            5,
            11 - level
        );


    createLetters();

    createObstacles();

    updateHUD();

    startTimer();


    currentIndex++;


    level =
        Math.min(
            10,
            Math.floor(
                currentIndex / 5
            ) + 1
        );

    updateHUD();
}


/* =========================================
   CREATE LETTERS
========================================= */

function createLetters(){

    const count =
        Math.min(
            6 +
            Math.floor(
                level / 2
            ),
            10
        );


    const targetUpper =
        target.toUpperCase();


    /*
       CAPITAL + SMALL
    */

    const list = [

        targetUpper,

        targetUpper.toLowerCase()

    ];


    while(
        list.length < count
    ){

        const wrong =
            alphabet[
                Math.floor(
                    Math.random() *
                    alphabet.length
                )
            ];


        if(
            wrong ===
            targetUpper
        ){

            continue;
        }


        list.push(
            Math.random() < .5
            ?
            wrong
            :
            wrong.toLowerCase()
        );
    }


    const mixed =
        shuffle(list);


    mixed.forEach(
        function(display,index){

            createLetter(
                display,
                index
            );

        }
    );
}


/* =========================================
   CREATE ONE LETTER
========================================= */

function createLetter(
    display,
    index
){

    const el =
        document.createElement(
            "div"
        );


    el.className =
        "letter " +
        [
            "red",
            "blue",
            "orange",
            "green"
        ][index % 4];


    /*
       NO TEXT HERE.
       THE IMAGE CONTAINS THE LETTER.
    */


    const img =
        document.createElement(
            "img"
        );


    img.className =
        "letterPicture";


    loadLetterImage(
        display,
        img
    );


    el.appendChild(img);


    const maxX =
        Math.max(
            10,
            window.innerWidth -
            85
        );


    const maxY =
        Math.max(
            40,
            window.innerHeight -
            260
        );


    const obj = {

        el:el,

        display:display,

        base:
            display.toUpperCase(),

        x:
            10 +
            Math.random() *
            maxX,

        y:
            145 +
            Math.random() *
            maxY,

        vx:
            (
                Math.random() < .5
                ?
                -1
                :
                1
            ) *
            (
                .65 +
                Math.random() *
                (1 + level*.12)
            ),

        vy:
            (
                Math.random() < .5
                ?
                -1
                :
                1
            ) *
            (
                .45 +
                Math.random() *
                (1 + level*.1)
            ),

        rotation:
            Math.random()*360,

        vr:
            (
                Math.random()-.5
            )*4,

        alive:true
    };


    game.appendChild(el);

    letters.push(obj);
}


/* =========================================
   CREATE OBSTACLES
========================================= */

function createObstacles(){

    const count =
        level >= 5
        ?
        2
        :
        1;


    for(
        let i=0;
        i<count;
        i++
    ){

        const img =
            document.createElement(
                "img"
            );


        img.className =
            "obstacle";


        loadObstacle(
            [
                "bomb.png",
                "Bomb.png",
                "BOMB.png",
                "bomb.PNG",
                "Bomb.PNG",
                "bomb.jpeg",
                "Bomb.jpeg",
                "ninja-star.png",
                "Ninja-Star.png",
                "NINJA-STAR.png",
                "ninja_star.png",
                "Ninja_Star.png",
                "ninja-star.jpeg"
            ],
            img
        );


        const obj = {

            el:img,

            x:
                20 +
                Math.random() *
                Math.max(
                    20,
                    window.innerWidth-80
                ),

            y:
                160 +
                Math.random() *
                Math.max(
                    20,
                    window.innerHeight-300
                ),

            vx:
                (
                    Math.random()<.5
                    ?
                    -1
                    :
                    1
                ) *
                (
                    1 +
                    level*.1
                ),

            vy:
                (
                    Math.random()<.5
                    ?
                    -1
                    :
                    1
                ) *
                (
                    .5 +
                    level*.08
                ),

            rotation:0,

            vr:
                (
                    Math.random()-.5
                )*6
        };


        game.appendChild(img);

        obstacles.push(obj);
    }
}


/* =========================================
   ANIMATION
========================================= */

function animate(){

    if(running){

        const w =
            window.innerWidth;

        const h =
            window.innerHeight;


        letters.forEach(
            function(obj){

                if(
                    !obj.alive
                )return;


                obj.x += obj.vx;

                obj.y += obj.vy;

                obj.rotation += obj.vr;


                if(
                    obj.x < 5 ||
                    obj.x > w-80
                ){

                    obj.vx *= -1;
                }


                if(
                    obj.y < 130 ||
                    obj.y > h-220
                ){

                    obj.vy *= -1;
                }


                obj.el.style.transform =
                    `
                    translate(
                        ${obj.x}px,
                        ${obj.y}px
                    )
                    rotate(
                        ${obj.rotation}deg
                    )
                    `;
            }
        );


        obstacles.forEach(
            function(obj){

                obj.x += obj.vx;

                obj.y += obj.vy;

                obj.rotation += obj.vr;


                if(
                    obj.x < 5 ||
                    obj.x > w-70
                ){

                    obj.vx *= -1;
                }


                if(
                    obj.y < 130 ||
                    obj.y > h-220
                ){

                    obj.vy *= -1;
                }


                obj.el.style.transform =
                    `
                    translate(
                        ${obj.x}px,
                        ${obj.y}px
                    )
                    rotate(
                        ${obj.rotation}deg
                    )
                    `;
            }
        );
    }


    requestAnimationFrame(
        animate
    );
}

animate();


/* =========================================
   TIMER
========================================= */

function startTimer(){

    clearInterval(timer);


    timer =
        setInterval(
            function(){

                if(!running)return;


                timeLeft--;

                updateHUD();


                if(
                    timeLeft <= 0
                ){

                    clearInterval(timer);

                    loseLife(
                        "TIME UP!"
                    );
                }

            },
            1000
        );
}


/* =========================================
   POINTER
========================================= */

game.addEventListener(
    "pointerdown",
    function(e){

        if(
            e.target.closest(
                ".gameButton"
            ) ||
            e.target.tagName ===
            "INPUT"
        ){

            return;
        }


        if(!running)return;


        lastX =
            e.clientX;

        lastY =
            e.clientY;


        checkCollision(
            e.clientX,
            e.clientY
        );
    }
);


game.addEventListener(
    "pointermove",
    function(e){

        if(!running)return;


        drawSlice(
            lastX,
            lastY,
            e.clientX,
            e.clientY
        );


        lastX =
            e.clientX;

        lastY =
            e.clientY;


        checkCollision(
            e.clientX,
            e.clientY
        );
    }
);


/* =========================================
   COLLISION
========================================= */

function checkCollision(
    x,
    y
){

    if(!running)return;


    letters.forEach(
        function(obj){

            if(
                !obj.alive
            )return;


            const rect =
                obj.el.getBoundingClientRect();


            const cx =
                rect.left +
                rect.width/2;


            const cy =
                rect.top +
                rect.height/2;


            const distance =
                Math.hypot(
                    x-cx,
                    y-cy
                );


            if(
                distance < 52
            ){

                sliceLetter(obj);
            }
        }
    );


    obstacles.forEach(
        function(obj){

            const rect =
                obj.el.getBoundingClientRect();


            const cx =
                rect.left +
                rect.width/2;


            const cy =
                rect.top +
                rect.height/2;


            const distance =
                Math.hypot(
                    x-cx,
                    y-cy
                );


            if(
                distance < 50
            ){

                hitObstacle(obj);
            }
        }
    );
}


/* =========================================
   SLICE LETTER
========================================= */

function sliceLetter(obj){

    if(
        !obj.alive
    )return;


    obj.alive =
        false;


    sliceSound();


    obj.el.classList.add(
        "hit"
    );


    const correct =
        obj.display
            .toUpperCase()
        ===
        target
            .toUpperCase();


    if(correct){

        correctLetter(obj);

    }else{

        wrongLetter();
    }


    /*
       KEEP THE PREVIOUS
       IMAGE ON SCREEN
       LONGER.
    */

    setTimeout(
        function(){

            obj.el.remove();

        },
        1300
    );
}


/* =========================================
   CORRECT
========================================= */

function correctLetter(obj){

    clearInterval(timer);


    correctSound();


    /*
       PLAY LETTER VOICE

       A.mp3
       B.mp3
       C.mp3
       ...
    */

    playLetterSound(
        obj.base
    );


    score +=
        10 * level;


    showMessage(
        "GREAT!"
    );


    updateHUD();


    /*
       WAIT LONGER BEFORE
       NEXT LETTER
    */

    setTimeout(
        function(){

            nextRound();

        },
        1400
    );
}


/* =========================================
   WRONG
========================================= */

function wrongLetter(){

    lives--;

    score =
        Math.max(
            0,
            score-5
        );


    wrongSound();


    showMessage(
        "WRONG!"
    );


    updateHUD();


    if(
        lives <= 0
    ){

        setTimeout(
            gameOver,
            500
        );
    }
}


/* =========================================
   OBSTACLE HIT
========================================= */

function hitObstacle(obj){

    lives--;

    score =
        Math.max(
            0,
            score-10
        );


    wrongSound();


    showMessage(
        "OUCH!"
    );


    obj.el.remove();


    updateHUD();


    if(
        lives <= 0
    ){

        setTimeout(
            gameOver,
            500
        );
    }
}


/* =========================================
   SLICE LINE
========================================= */

function drawSlice(
    x1,
    y1,
    x2,
    y2
){

    const line =
        document.createElement(
            "div"
        );


    line.className =
        "sliceLine";


    const dx =
        x2-x1;

    const dy =
        y2-y1;


    const length =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


    if(
        length < 3
    )return;


    const angle =
        Math.atan2(
            dy,
            dx
        ) *
        180 /
        Math.PI;


    line.style.width =
        length +
        "px";


    line.style.left =
        x1 +
        "px";


    line.style.top =
        y1 +
        "px";


    line.style.transform =
        `rotate(${angle}deg)`;


    game.appendChild(line);


    setTimeout(
        function(){

            line.remove();

        },
        180
    );
}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text){

    message.textContent =
        text;


    message.classList.remove(
        "pop"
    );


    void message.offsetWidth;


    message.classList.add(
        "pop"
    );
}


/* =========================================
   LOSE LIFE
========================================= */

function loseLife(reason){

    if(!running)return;


    lives--;


    wrongSound();


    showMessage(
        reason
    );


    updateHUD();


    if(
        lives <= 0
    ){

        setTimeout(
            gameOver,
            500
        );

    }else{

        setTimeout(
            nextRound,
            600
        );
    }
}


/* =========================================
   GAME OVER
========================================= */

function gameOver(){

    if(!running)return;


    running =
        false;


    clearInterval(timer);

    clearLetters();

    clearObstacles();

    gameOverSound();


    document.getElementById(
        "gameOverName"
    ).textContent =
        playerName;


    document.getElementById(
        "finalScore"
    ).textContent =
        score;


    document.getElementById(
        "finalLevel"
    ).textContent =
        level;


    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =========================================
   WIN
========================================= */

function winGame(){

    running =
        false;


    clearInterval(timer);

    clearLetters();

    clearObstacles();


    tone(
        523,
        .2,
        "square",
        .2
    );


    setTimeout(
        function(){

            tone(
                659,
                .2,
                "square",
                .2
            );

        },
        150
    );


    setTimeout(
        function(){

            tone(
                784,
                .3,
                "square",
                .2
            );

        },
        300
    );


    document.getElementById(
        "winName"
    ).textContent =
        "Great job, " +
        playerName +
        "!";


    document.getElementById(
        "winScore"
    ).textContent =
        score;


    winScreen.classList.remove(
        "hidden"
    );
}


/* =========================================
   CLEAR LETTERS
========================================= */

function clearLetters(){

    letters.forEach(
        function(obj){

            if(obj.el){
                obj.el.remove();
            }

        }
    );

    letters = [];
}


/* =========================================
   CLEAR OBSTACLES
========================================= */

function clearObstacles(){

    obstacles.forEach(
        function(obj){

            if(obj.el){
                obj.el.remove();
            }

        }
    );

    obstacles = [];
}


/* =========================================
   BUTTONS
========================================= */

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);


document
.getElementById("againButton")
.addEventListener(
    "click",
    startGame
);


document
.getElementById("winAgainButton")
.addEventListener(
    "click",
    startGame
);


/* =========================================
   ENTER KEY
========================================= */

nameInput.addEventListener(
    "keydown",
    function(e){

        if(
            e.key ===
            "Enter"
        ){

            startGame();
        }
    }
);

</script>
