<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Ninja Alphabet Adventure</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
}

body{
    background:#62d8ff;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        #62d8ff 0%,
        #c9f5ff 67%,
        #70c94d 67%,
        #439d32 100%
    );
}

/* CLOUDS */
.cloud{
    position:absolute;
    width:120px;
    height:38px;
    background:white;
    border-radius:40px;
    opacity:.75;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:50px;
    height:50px;
    left:15px;
    top:-22px;
}

.cloud:after{
    width:60px;
    height:60px;
    right:10px;
    top:-27px;
}

.cloud1{
    left:5%;
    top:13%;
}

.cloud2{
    right:5%;
    top:25%;
}

/* HUD */
#hud{
    position:absolute;
    top:8px;
    left:7px;
    right:7px;
    display:flex;
    justify-content:space-between;
    gap:5px;
    z-index:500;
}

.hudBox{
    background:white;
    border:3px solid #222;
    border-radius:12px;
    padding:6px 9px;
    font-size:13px;
    font-weight:bold;
    color:#222;
    box-shadow:0 4px 0 rgba(0,0,0,.25);
}

/* TARGET */
#targetBox{
    position:absolute;
    top:58px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    border:4px solid #222;
    border-radius:18px;
    padding:4px 24px;
    text-align:center;
    z-index:500;
    box-shadow:0 5px 0 rgba(0,0,0,.25);
}

#targetTitle{
    font-size:11px;
    font-weight:bold;
}

#target{
    font-size:45px;
    line-height:48px;
    font-weight:900;
    color:#e63946;
    text-shadow:2px 2px 0 #222;
}

/* LETTER */
.letter{
    position:absolute;
    width:70px;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:40px;
    font-weight:900;
    color:white;
    text-shadow:3px 3px 0 #222;
    border:5px solid white;
    box-shadow:
        0 7px 0 rgba(0,0,0,.3),
        inset 0 0 0 3px rgba(0,0,0,.15);
    z-index:100;
    user-select:none;
    -webkit-user-select:none;
}

.red{
    background:#ff4757;
}

.blue{
    background:#3742fa;
}

.orange{
    background:#ffa502;
}

.green{
    background:#2ed573;
}

/* LETTER IMAGE */
.letterPicture{
    position:absolute;
    width:27px;
    height:27px;
    right:-5px;
    bottom:-5px;
    object-fit:contain;
    background:white;
    border:2px solid #222;
    border-radius:50%;
    padding:2px;
}

.hit{
    animation:hit .18s ease-out;
}

@keyframes hit{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.4) rotate(12deg);
    }
    100%{
        transform:scale(0);
    }
}

/* SLICE LINE */
.sliceLine{
    position:absolute;
    height:8px;
    background:
        linear-gradient(
            to right,
            transparent,
            white,
            #b9f3ff,
            white,
            transparent
        );
    border-radius:20px;
    box-shadow:
        0 0 8px white,
        0 0 18px #70eaff;
    pointer-events:none;
    z-index:800;
    animation:sliceFade .18s ease-out forwards;
}

@keyframes sliceFade{
    from{opacity:1;}
    to{opacity:0;}
}

/* MESSAGE */
#message{
    position:absolute;
    left:50%;
    top:44%;
    transform:translate(-50%,-50%);
    z-index:700;
    font-size:50px;
    font-weight:900;
    color:white;
    text-shadow:4px 4px 0 #222;
    opacity:0;
    pointer-events:none;
}

.pop{
    animation:pop .7s ease-out;
}

@keyframes pop{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.3);
    }
    35%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.2);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-80%) scale(1);
    }
}

/* OBSTACLES */
.obstacle{
    position:absolute;
    width:62px;
    height:62px;
    object-fit:contain;
    z-index:120;
    pointer-events:none;
    filter:drop-shadow(0 5px 4px rgba(0,0,0,.35));
}

/* SCREENS */
.screen{
    position:absolute;
    inset:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    color:white;
}

.screen h1{
    font-size:clamp(40px,10vw,65px);
    text-shadow:4px 4px 0 #222;
}

.screen h2{
    margin:8px 0;
}

.screen p{
    margin:5px;
}

#startScreen{
    background:linear-gradient(135deg,#3b82f6,#7c3aed);
}

#gameOverScreen{
    background:linear-gradient(135deg,#e63946,#7028a0);
}

#winScreen{
    background:linear-gradient(135deg,#00b894,#0984e3);
}

/* NAME */
#playerName{
    width:min(320px,85vw);
    padding:14px;
    margin:18px 0;
    border:3px solid #222;
    border-radius:15px;
    font-size:20px;
    text-align:center;
    color:#222;
    background:white;
    user-select:text;
    -webkit-user-select:text;
    touch-action:auto;
}

/* BUTTON */
.gameButton{
    border:4px solid #222;
    border-radius:20px;
    background:#ffd43b;
    color:#222;
    padding:14px 32px;
    font-size:21px;
    font-weight:bold;
    box-shadow:0 7px 0 #9b7200;
    touch-action:manipulation;
}

.gameButton:active{
    transform:translateY(6px);
    box-shadow:0 1px 0 #9b7200;
}

.hidden{
    display:none!important;
}

@media(max-height:600px){
    #targetBox{
        top:48px;
    }

    .letter{
        width:60px;
        height:60px;
        font-size:34px;
    }
}
</style>
</head>

<script>

/* =====================================
   ALPHABET
===================================== */

const alphabet =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");


/* =====================================
   VARIABLES
===================================== */

let shuffledAlphabet = [];

let letters = [];

let obstacles = [];

let target = "A";

let score = 0;

let lives = 5;

let level = 1;

let currentLetterIndex = 0;

let timeLeft = 10;

let timer = null;

let running = false;

let playerName = "Ninja";

let audioContext = null;

let lastX = 0;

let lastY = 0;


/* =====================================
   ELEMENTS
===================================== */

const game =
document.getElementById("game");

const targetEl =
document.getElementById("target");

const scoreEl =
document.getElementById("score");

const livesEl =
document.getElementById("lives");

const levelEl =
document.getElementById("level");

const timerEl =
document.getElementById("timer");

const message =
document.getElementById("message");

const nameInput =
document.getElementById("playerName");

const startScreen =
document.getElementById("startScreen");

const gameOverScreen =
document.getElementById("gameOverScreen");

const winScreen =
document.getElementById("winScreen");


/* =====================================
   SHUFFLE
===================================== */

function shuffle(array){

    const arr=[...array];

    for(
        let i=arr.length-1;
        i>0;
        i--
    ){

        const j=Math.floor(
            Math.random()*(i+1)
        );

        [
            arr[i],
            arr[j]
        ]=[
            arr[j],
            arr[i]
        ];
    }

    return arr;
}


/* =====================================
   AUDIO CONTEXT
===================================== */

function initAudio(){

    if(!audioContext){

        const AC =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AC){
            audioContext=new AC();
        }
    }

    if(
        audioContext &&
        audioContext.state==="suspended"
    ){
        audioContext.resume();
    }
}


/* =====================================
   SIMPLE SOUND EFFECTS
===================================== */

function tone(
    frequency,
    duration,
    type="sine",
    volume=.25
){

    if(!audioContext)return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type=type;

    osc.frequency.value=frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+duration
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime+duration
    );
}


function sliceSound(){

    if(!audioContext)return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type="sawtooth";

    osc.frequency.setValueAtTime(
        1800,
        audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        150,
        audioContext.currentTime+.12
    );

    gain.gain.setValueAtTime(
        .35,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+.12
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime+.12
    );
}


function correctSound(){

    tone(
        600,
        .1,
        "square",
        .2
    );

    setTimeout(
        ()=>{
            tone(
                900,
                .14,
                "square",
                .2
            );
        },
        100
    );
}


function wrongSound(){

    tone(
        120,
        .3,
        "sawtooth",
        .35
    );
}


function gameOverSound(){

    tone(
        180,
        .35,
        "sawtooth",
        .45
    );

    setTimeout(
        ()=>{
            tone(
                120,
                .45,
                "sawtooth",
                .45
            );
        },
        300
    );

    setTimeout(
        ()=>{
            tone(
                70,
                .7,
                "sawtooth",
                .45
            );
        },
        700
    );
}


/* =====================================
   FIND FILE
   BIG LETTER + SMALL LETTER
   JPEG + PNG + JPG
===================================== */

function findImage(
    letter,
    img
){

    const lower =
        letter.toLowerCase();

    const upper =
        letter.toUpperCase();

    const possibleFiles=[

        lower+".jpeg",
        upper+".jpeg",

        lower+".jpg",
        upper+".jpg",

        lower+".png",
        upper+".png"

    ];

    let index=0;


    function tryNext(){

        if(
            index>=possibleFiles.length
        ){

            img.style.display="none";

            return;
        }


        const file =
            possibleFiles[index];

        index++;


        img.onload=()=>{
            img.style.display="block";
        };


        img.onerror=()=>{
            tryNext();
        };


        img.src=file;
    }


    tryNext();
}


/* =====================================
   FIND AUDIO FILE
   BIG + SMALL
===================================== */

function playLetterSound(letter){

    const lower =
        letter.toLowerCase();

    const upper =
        letter.toUpperCase();

    const possibleFiles=[

        lower+".mp3",
        upper+".mp3",

        lower+".wav",
        upper+".wav",

        lower+".m4a",
        upper+".m4a"

    ];


    let index=0;


    function tryNext(){

        if(
            index>=possibleFiles.length
        ){

            console.log(
                "Letter sound not found:",
                letter
            );

            return;
        }


        const file =
            possibleFiles[index];

        index++;


        const audio =
            new Audio();

        audio.volume=1;

        audio.oncanplaythrough=()=>{
            audio.play().catch(
                ()=>{}
            );
        };

        audio.onerror=()=>{
            tryNext();
        };

        audio.src=file;

        audio.load();
    }


    tryNext();
}


/* =====================================
   FIND OBSTACLE IMAGE
===================================== */

function findObstacleImage(
    names,
    img
){

    let index=0;


    function tryNext(){

        if(
            index>=names.length
        ){

            img.style.display="none";

            return;
        }


        img.onload=()=>{
            img.style.display="block";
        };


        img.onerror=()=>{
            index++;
            tryNext();
        };


        img.src=
            names[index];

    }


    tryNext();
}


/* =====================================
   START GAME
===================================== */

function startGame(){

    initAudio();

    playerName =
        nameInput.value.trim()
        ||
        "Ninja";

    score=0;

    lives=5;

    level=1;

    currentLetterIndex=0;

    shuffledAlphabet =
        shuffle(alphabet);

    running=true;

    clearLetters();

    clearObstacles();

    startScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );

    winScreen.classList.add(
        "hidden"
    );

    updateHUD();

    nextRound();
}


/* =====================================
   HUD
===================================== */

function updateHUD(){

    scoreEl.textContent=score;

    livesEl.textContent=lives;

    levelEl.textContent=level;

    timerEl.textContent=timeLeft;
}


/* =====================================
   NEXT ROUND
===================================== */

function nextRound(){

    if(!running)return;

    clearLetters();

    clearObstacles();


    if(
        currentLetterIndex >=
        shuffledAlphabet.length
    ){

        winGame();

        return;
    }


    const base =
        shuffledAlphabet[
            currentLetterIndex
        ];


    /*
       Sometimes CAPITAL
       Sometimes lowercase
    */

    target =
        Math.random()<.5
        ?
        base
        :
        base.toLowerCase();


    targetEl.textContent=target;


    timeLeft =
        Math.max(
            5,
            11-level
        );


    updateHUD();

    createLetters();

    createObstacles();

    startTimer();


    currentLetterIndex++;


    level =
        Math.min(
            10,
            Math.floor(
                currentLetterIndex/5
            )+1
        );


    updateHUD();
}


/* =====================================
   CREATE LETTERS
===================================== */

function createLetters(){

    const count =
        Math.min(
            6+
            Math.floor(level/2),
            10
        );


    const targetUpper =
        target.toUpperCase();


    /*
       BOTH CAPITAL AND SMALL
       ARE CREATED
    */

    const lettersToCreate=[

        targetUpper,

        targetUpper.toLowerCase()

    ];


    while(
        lettersToCreate.length<count
    ){

        const wrong =
            alphabet[
                Math.floor(
                    Math.random()*
                    alphabet.length
                )
            ];


        if(
            wrong===targetUpper
        ){
            continue;
        }


        lettersToCreate.push(

            Math.random()<.5
            ?
            wrong
            :
            wrong.toLowerCase()
        );
    }


    shuffle(
        lettersToCreate
    ).forEach(
        (display,index)=>{

            createLetter(
                display,
                display.toUpperCase(),
                index
            );

        }
    );
}


/* =====================================
   CREATE LETTER
===================================== */

function createLetter(
    display,
    base,
    index
){

    const el =
        document.createElement("div");


    el.className =
        "letter "+
        [
            "red",
            "blue",
            "orange",
            "green"
        ][index%4];


    el.textContent=display;


    const img =
        document.createElement("img");


    img.className=
        "letterPicture";


    findImage(
        base,
        img
    );


    el.appendChild(img);


    const maxX =
        Math.max(
            10,
            window.innerWidth-85
        );


    const maxY =
        Math.max(
            40,
            window.innerHeight-260
        );


    const obj={

        el:el,

        display:display,

        base:base,

        x:
            10+
            Math.random()*maxX,

        y:
            145+
            Math.random()*maxY,

        vx:
            (
                Math.random()<.5
                ?
                -1
                :
                1
            )*
            (
                .65+
                Math.random()*
                (1+level*.12)
            ),

        vy:
            (
                Math.random()<.5
                ?
                -1
                :
                1
            )*
            (
                .45+
                Math.random()*
                (1+level*.1)
            ),

        rotation:
            Math.random()*360,

        vr:
            (
                Math.random()-.5
            )*4,

        alive:true
    };


    game.appendChild(el);

    letters.push(obj);
}


/* =====================================
   OBSTACLES
===================================== */

function createObstacles(){

    const count =
        level>=5
        ?
        2
        :
        1;


    for(
        let i=0;
        i<count;
        i++
    ){

        const img =
            document.createElement("img");


        img.className=
            "obstacle";


        /*
           TRY MANY NAMES
        */

        if(
            Math.random()<.5
        ){

            findObstacleImage(
                [
                    "bomb.png",
                    "Bomb.png",
                    "BOMB.png",
                    "bomb.PNG",
                    "Bomb.PNG"
                ],
                img
            );

        }else{

            findObstacleImage(
                [
                    "ninja-star.png",
                    "Ninja-Star.png",
                    "NINJA-STAR.png",
                    "ninja_star.png",
                    "Ninja_Star.png"
                ],
                img
            );
        }


        const obj={

            el:img,

            x:
                20+
                Math.random()*
                Math.max(
                    20,
                    window.innerWidth-80
                ),

            y:
                160+
                Math.random()*
                Math.max(
                    20,
                    window.innerHeight-300
                ),

            vx:
                (
                    Math.random()<.5
                    ?
                    -1
                    :
                    1
                )*
                (
                    1+
                    level*.1
                ),

            vy:
                (
                    Math.random()<.5
                    ?
                    -1
                    :
                    1
                )*
                (
                    .5+
                    level*.08
                ),

            rotation:0,

            vr:
                (
                    Math.random()-.5
                )*6
        };


        game.appendChild(img);

        obstacles.push(obj);
    }
}


/* =====================================
   ANIMATION
===================================== */

function animate(){

    if(running){

        const w =
            window.innerWidth;

        const h =
            window.innerHeight;


        letters.forEach(
            obj=>{

                if(!obj.alive)return;


                obj.x+=obj.vx;

                obj.y+=obj.vy;

                obj.rotation+=obj.vr;


                if(
                    obj.x<5 ||
                    obj.x>w-80
                ){
                    obj.vx*=-1;
                }


                if(
                    obj.y<130 ||
                    obj.y>h-220
                ){
                    obj.vy*=-1;
                }


                obj.el.style.transform=
                `
                translate(
                    ${obj.x}px,
                    ${obj.y}px
                )
                rotate(
                    ${obj.rotation}deg
                )
                `;
            }
        );


        obstacles.forEach(
            obj=>{

                obj.x+=obj.vx;

                obj.y+=obj.vy;

                obj.rotation+=obj.vr;


                if(
                    obj.x<5 ||
                    obj.x>w-70
                ){
                    obj.vx*=-1;
                }


                if(
                    obj.y<130 ||
                    obj.y>h-220
                ){
                    obj.vy*=-1;
                }


                obj.el.style.transform=
                `
                translate(
                    ${obj.x}px,
                    ${obj.y}px
                )
                rotate(
                    ${obj.rotation}deg
                )
                `;
            }
        );
    }


    requestAnimationFrame(
        animate
    );
}

animate();


/* =====================================
   TIMER
===================================== */

function startTimer(){

    clearInterval(timer);


    timer =
        setInterval(
            ()=>{

                if(!running)return;

                timeLeft--;

                updateHUD();


                if(
                    timeLeft<=0
                ){

                    clearInterval(timer);

                    loseLife(
                        "TIME UP!"
                    );
                }

            },
            1000
        );
}


/* =====================================
   POINTER
===================================== */

game.addEventListener(
    "pointerdown",
    e=>{

        if(
            e.target.closest(
                ".gameButton"
            ) ||
            e.target.tagName==="INPUT"
        ){
            return;
        }


        if(!running)return;


        lastX=e.clientX;

        lastY=e.clientY;


        checkCollision(
            e.clientX,
            e.clientY
        );
    }
);


game.addEventListener(
    "pointermove",
    e=>{

        if(!running)return;


        drawSlice(
            lastX,
            lastY,
            e.clientX,
            e.clientY
        );


        lastX=e.clientX;

        lastY=e.clientY;


        checkCollision(
            e.clientX,
            e.clientY
        );
    }
);


/* =====================================
   COLLISION
===================================== */

function checkCollision(
    x,
    y
){

    if(!running)return;


    letters.forEach(
        obj=>{

            if(!obj.alive)return;


            const rect =
                obj.el.getBoundingClientRect();


            const cx =
                rect.left+
                rect.width/2;


            const cy =
                rect.top+
                rect.height/2;


            const distance =
                Math.hypot(
                    x-cx,
                    y-cy
                );


            if(distance<52){

                sliceLetter(obj);
            }
        }
    );


    obstacles.forEach(
        obj=>{

            const rect =
                obj.el.getBoundingClientRect();


            const cx =
                rect.left+
                rect.width/2;


            const cy =
                rect.top+
                rect.height/2;


            const distance =
                Math.hypot(
                    x-cx,
                    y-cy
                );


            if(distance<50){

                hitObstacle(obj);
            }
        }
    );
}


/* =====================================
   SLICE LETTER
===================================== */

function sliceLetter(obj){

    if(!obj.alive)return;


    obj.alive=false;


    sliceSound();


    obj.el.classList.add(
        "hit"
    );


    /*
       CAPITAL AND SMALL
       ARE EQUAL
    */

    const correct =
        obj.display.toUpperCase()
        ===
        target.toUpperCase();


    if(correct){

        correctLetter(obj);

    }else{

        wrongLetter();
    }


    setTimeout(
        ()=>{
            obj.el.remove();
        },
        180
    );
}


/* =====================================
   CORRECT
===================================== */

function correctLetter(obj){

    clearInterval(timer);

    correctSound();


    /*
       PLAY THE REAL LETTER AUDIO
    */

    playLetterSound(
        obj.base
    );


    score +=
        10*level;


    showMessage(
        "GREAT!"
    );


    updateHUD();


    setTimeout(
        ()=>{
            nextRound();
        },
        700
    );
}


/* =====================================
   WRONG
===================================== */

function wrongLetter(){

    lives--;

    score=
        Math.max(
            0,
            score-5
        );


    wrongSound();

    showMessage(
        "WRONG!"
    );


    updateHUD();


    if(lives<=0){

        setTimeout(
            gameOver,
            450
        );
    }
}


/* =====================================
   HIT OBSTACLE
===================================== */

function hitObstacle(obj){

    lives--;

    score=
        Math.max(
            0,
            score-10
        );


    wrongSound();

    showMessage(
        "OUCH!"
    );


    obj.el.remove();


    updateHUD();


    if(lives<=0){

        setTimeout(
            gameOver,
            450
        );
    }
}


/* =====================================
   SLICE LINE
===================================== */

function drawSlice(
    x1,
    y1,
    x2,
    y2
){

    const line =
        document.createElement("div");


    line.className=
        "sliceLine";


    const dx=x2-x1;

    const dy=y2-y1;


    const length=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    if(length<3)return;


    const angle=
        Math.atan2(dy,dx)
        *
        180/
        Math.PI;


    line.style.width=
        length+"px";


    line.style.left=
        x1+"px";


    line.style.top=
        y1+"px";


    line.style.transform=
        `rotate(${angle}deg)`;


    game.appendChild(line);


    setTimeout(
        ()=>{
            line.remove();
        },
        180
    );
}


/* =====================================
   MESSAGE
===================================== */

function showMessage(text){

    message.textContent=text;

    message.classList.remove(
        "pop"
    );

    void message.offsetWidth;

    message.classList.add(
        "pop"
    );
}


/* =====================================
   LOSE LIFE
===================================== */

function loseLife(reason){

    if(!running)return;


    lives--;

    wrongSound();

    showMessage(reason);

    updateHUD();


    if(lives<=0){

        setTimeout(
            gameOver,
            500
        );

    }else{

        setTimeout(
            nextRound,
            600
        );
    }
}


/* =====================================
   GAME OVER
===================================== */

function gameOver(){

    if(!running)return;


    running=false;

    clearInterval(timer);

    clearLetters();

    clearObstacles();

    gameOverSound();


    document.getElementById(
        "gameOverName"
    ).textContent=
        playerName;


    document.getElementById(
        "finalScore"
    ).textContent=
        score;


    document.getElementById(
        "finalLevel"
    ).textContent=
        level;


    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =====================================
   WIN
===================================== */

function winGame(){

    running=false;

    clearInterval(timer);

    clearLetters();

    clearObstacles();


    tone(
        523,
        .2,
        "square",
        .2
    );

    setTimeout(
        ()=>{
            tone(
                659,
                .2,
                "square",
                .2
            );
        },
        150
    );

    setTimeout(
        ()=>{
            tone(
                784,
                .3,
                "square",
                .2
            );
        },
        300
    );


    document.getElementById(
        "winName"
    ).textContent=
        "Great job, "+
        playerName+"!";


    document.getElementById(
        "winScore"
    ).textContent=
        score;


    winScreen.classList.remove(
        "hidden"
    );
}


/* =====================================
   CLEAR
===================================== */

function clearLetters(){

    letters.forEach(
        obj=>{
            if(obj.el){
                obj.el.remove();
            }
        }
    );

    letters=[];
}


function clearObstacles(){

    obstacles.forEach(
        obj=>{
            if(obj.el){
                obj.el.remove();
            }
        }
    );

    obstacles=[];
}


/* =====================================
   BUTTONS
===================================== */

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);


document
.getElementById("againButton")
.addEventListener(
    "click",
    startGame
);


document
.getElementById("winAgainButton")
.addEventListener(
    "click",
    startGame
);


/* =====================================
   ENTER
===================================== */

nameInput.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter"){
            startGame();
        }

    }
);

</script>
