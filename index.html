<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Ninja Alphabet Adventure</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
}

body{
    background:#07152b;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            #263d67 0%,
            #14284a 45%,
            #07152b 100%
        );
}

/* =========================
   NINJA BACKGROUND
========================= */

.ninjaBackground{
    position:absolute;

    left:50%;
    top:48%;

    transform:
        translate(-50%,-50%);

    font-size:
        clamp(100px,30vw,220px);

    opacity:.12;

    filter:
        drop-shadow(
            0 0 25px
            rgba(255,255,255,.2)
        );

    pointer-events:none;

    z-index:1;
}

/* =========================
   MOON
========================= */

.moon{
    position:absolute;

    width:90px;
    height:90px;

    right:7%;
    top:12%;

    border-radius:50%;

    background:#fff3b0;

    box-shadow:
        0 0 35px
        rgba(255,243,176,.5);

    z-index:2;
}

/* =========================
   STARS
========================= */

.star{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:white;

    opacity:.8;

    z-index:2;
}

.star1{left:8%;top:12%}
.star2{left:22%;top:25%}
.star3{left:40%;top:10%}
.star4{left:62%;top:18%}
.star5{left:82%;top:9%}
.star6{left:91%;top:30%}
.star7{left:14%;top:40%}
.star8{left:73%;top:38%}
.star9{left:50%;top:27%}
.star10{left:30%;top:8%}

/* =========================
   GROUND
========================= */

.ground{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:20%;

    background:
        linear-gradient(
            to bottom,
            #173d19,
            #071d0a
        );

    z-index:3;
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;

    top:8px;
    left:7px;
    right:7px;

    display:flex;

    justify-content:space-between;

    gap:5px;

    z-index:700;
}

.hudBox{
    background:white;

    border:3px solid #222;

    border-radius:12px;

    padding:6px 9px;

    font-size:13px;

    font-weight:bold;

    color:#222;

    box-shadow:
        0 4px 0
        rgba(0,0,0,.3);
}

/* =========================
   TARGET
========================= */

#targetBox{
    position:absolute;

    top:58px;
    left:50%;

    transform:
        translateX(-50%);

    background:white;

    border:4px solid #222;

    border-radius:18px;

    padding:4px 25px;

    min-width:120px;

    text-align:center;

    z-index:700;

    box-shadow:
        0 5px 0
        rgba(0,0,0,.3);
}

#targetTitle{
    font-size:11px;
    font-weight:bold;
}

#target{
    font-size:46px;
    line-height:48px;

    font-weight:900;

    color:#e63946;

    text-shadow:
        2px 2px 0 #222;
}

/* =========================
   LETTER CIRCLE
========================= */

.letter{

    position:absolute;

    width:82px;
    height:82px;

    border-radius:50%;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #d9e2ec 100%
        );

    border:4px solid white;

    box-shadow:
        0 7px 0
        rgba(0,0,0,.35),
        0 0 12px
        rgba(255,255,255,.25);

    z-index:300;

    user-select:none;
    -webkit-user-select:none;

    pointer-events:auto;

    display:flex;

    align-items:center;
    justify-content:center;
}

/* IMAGE INSIDE CIRCLE */

.letterPicture{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;

    border:none;

    padding:0;
    margin:0;

    background:#ffffff;

    pointer-events:none;

    opacity:1;
}

/* LOADING PLACEHOLDER */

.loadingCircle{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #eeeeee,
            #cfd8dc
        );

    color:#555;

    font-size:24px;

    font-weight:bold;

    z-index:-1;
}

/* =========================
   HIT
========================= */

.hit{
    animation:
        hitAnimation .22s
        ease-out forwards;
}

@keyframes hitAnimation{

    0%{
        transform:scale(1);
    }

    50%{
        transform:
            scale(1.35)
            rotate(12deg);
    }

    100%{
        transform:
            scale(0);
        opacity:0;
    }
}

/* =========================
   SLICE
========================= */

.sliceLine{

    position:absolute;

    height:8px;

    background:
        linear-gradient(
            to right,
            transparent,
            white,
            #baf5ff,
            white,
            transparent
        );

    border-radius:20px;

    box-shadow:
        0 0 8px white,
        0 0 18px #70eaff;

    pointer-events:none;

    z-index:900;

    animation:
        sliceFade .18s
        ease-out forwards;
}

@keyframes sliceFade{

    from{
        opacity:1;
    }

    to{
        opacity:0;
    }
}

/* =========================
   MESSAGE
========================= */

#message{

    position:absolute;

    left:50%;
    top:45%;

    transform:
        translate(-50%,-50%);

    z-index:800;

    font-size:50px;

    font-weight:900;

    color:white;

    text-shadow:
        4px 4px 0 #111;

    opacity:0;

    pointer-events:none;
}

.pop{
    animation:
        popAnimation .7s
        ease-out;
}

@keyframes popAnimation{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.3);
    }

    35%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.2);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-80%)
            scale(1);
    }
}

/* =========================
   BOMBS
========================= */

.obstacle{

    position:absolute;

    width:64px;
    height:64px;

    object-fit:contain;

    z-index:350;

    pointer-events:none;

    filter:
        drop-shadow(
            0 5px 4px
            rgba(0,0,0,.5)
        );
}

/* =========================
   SCREENS
========================= */

.screen{

    position:absolute;

    inset:0;

    z-index:1000;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:20px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #0b1d36,
            #172d4d,
            #261747
        );
}

.screen h1{

    font-size:
        clamp(40px,10vw,65px);

    text-shadow:
        4px 4px 0 #111;
}

.screen h2{
    margin:8px 0;
}

.screen p{
    margin:5px;
}

/* =========================
   INPUT
========================= */

#playerName{

    width:min(320px,85vw);

    padding:14px;

    margin:18px 0;

    border:3px solid #222;

    border-radius:15px;

    font-size:20px;

    text-align:center;

    color:#222;

    background:white;

    user-select:text;

    -webkit-user-select:text;

    touch-action:auto;
}

/* =========================
   BUTTON
========================= */

.gameButton{

    border:4px solid #222;

    border-radius:20px;

    background:#ffd43b;

    color:#222;

    padding:14px 32px;

    font-size:21px;

    font-weight:bold;

    box-shadow:
        0 7px 0 #9b7200;

    touch-action:manipulation;
}

.gameButton:active{

    transform:
        translateY(6px);

    box-shadow:
        0 1px 0 #9b7200;
}

.hidden{
    display:none !important;
}

/* =========================
   MOBILE
========================= */

@media(max-height:600px){

    #targetBox{
        top:48px;
    }

    .letter{
        width:68px;
        height:68px;
    }

    .obstacle{
        width:54px;
        height:54px;
    }

    .ninjaBackground{
        font-size:130px;
    }
}

</style>
</head>

<body>

<div id="game">

    <!-- BACKGROUND -->

    <div class="star star1"></div>
    <div class="star star2"></div>
    <div class="star star3"></div>
    <div class="star star4"></div>
    <div class="star star5"></div>
    <div class="star star6"></div>
    <div class="star star7"></div>
    <div class="star star8"></div>
    <div class="star star9"></div>
    <div class="star star10"></div>

    <div class="moon"></div>

    <!-- NINJA IN CENTER -->

    <div class="ninjaBackground">
        🥷
    </div>

    <div class="ground"></div>


    <!-- HUD -->

    <div id="hud">

        <div class="hudBox">
            ⭐ <span id="score">0</span>

    <div id="targetBox">

            class="gameButton"

        </button>

        <p style="margin-top:15px;">

<script>

/* =========================================
   ALPHABET
========================================= */

const alphabet =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");


/* =========================================
   VARIABLES
========================================= */

let letters = [];

let obstacles = [];

let shuffledAlphabet = [];

let target = "A";

let score = 0;

let lives = 5;

let level = 1;

let currentIndex = 0;

let timeLeft = 10;

let timer = null;

let running = false;

let playerName = "Ninja";

let audioContext = null;

let lastX = 0;

let lastY = 0;


/* =========================================
   ELEMENTS
========================================= */

const game =
document.getElementById("game");

const targetEl =
document.getElementById("target");

const scoreEl =
document.getElementById("score");

const livesEl =
document.getElementById("lives");

const levelEl =
document.getElementById("level");

const timerEl =
document.getElementById("timer");

const message =
document.getElementById("message");

const nameInput =
document.getElementById("playerName");

const startScreen =
document.getElementById("startScreen");

const gameOverScreen =
document.getElementById("gameOverScreen");

const winScreen =
document.getElementById("winScreen");


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array){

    const arr = [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];
    }

    return arr;
}


/* =========================================
   AUDIO
========================================= */

function initAudio(){

    if(!audioContext){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioContext){

            audioContext =
                new AudioContext();
        }
    }

    if(
        audioContext &&
        audioContext.state === "suspended"
    ){

        audioContext.resume();
    }
}


/* =========================================
   SOUND
========================================= */

function tone(
    frequency,
    duration,
    type="sine",
    volume=.25
){

    if(!audioContext)return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = type;

    osc.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime +
        duration
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime +
        duration
    );
}


function sliceSound(){

    if(!audioContext)return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type =
        "sawtooth";

    osc.frequency.setValueAtTime(
        1800,
        audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        150,
        audioContext.currentTime +
        .12
    );

    gain.gain.setValueAtTime(
        .35,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime +
        .12
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime +
        .12
    );
}


function correctSound(){

    tone(
        600,
        .1,
        "square",
        .2
    );

    setTimeout(
        () => {

            tone(
                900,
                .14,
                "square",
                .2
            );

        },
        100
    );
}


function wrongSound(){

    tone(
        120,
        .3,
        "sawtooth",
        .35
    );
}


function gameOverSound(){

    tone(
        180,
        .35,
        "sawtooth",
        .45
    );

    setTimeout(
        () => {

            tone(
                120,
                .45,
                "sawtooth",
                .45
            );

        },
        300
    );

    setTimeout(
        () => {

            tone(
                70,
                .7,
                "sawtooth",
                .45
            );

        },
        700
    );
}


/* =========================================
   IMAGE LOADER
   IMPORTANT:
   EACH CIRCLE HAS ONLY ONE IMAGE
========================================= */

function loadLetterImage(letter, img){

    const upper =
        letter.toUpperCase();

    const extensions = [
        "jpeg",
        "png",
        "jpg"
    ];

    let index = 0;

    function tryNext(){

        if(index >= extensions.length){

            console.log(
                "IMAGE NOT FOUND:",
                upper
            );

            return;
        }

        const extension =
            extensions[index++];

        const filename =
            upper + "." + extension;

        const testImage =
            new Image();

        testImage.onload =
            function(){

                /*
                   Only assign the image
                   after it is completely loaded.
                */

                img.src =
                    testImage.src;

                img.style.display =
                    "block";

                console.log(
                    "LOADED:",
                    filename
                );
            };

        testImage.onerror =
            function(){

                tryNext();
            };

        /*
           Cache busting prevents old
           GitHub Pages images from appearing.
        */

        testImage.src =
            "./" +
            filename +
            "?v=" +
            Date.now();
    }

    tryNext();
}


/* =========================================
   LETTER AUDIO
========================================= */

function playLetterSound(letter){

    return new Promise(
        function(resolve){

            const upper =
                letter.toUpperCase();

            const audio =
                new Audio(
                    "./" +
                    upper +
                    ".mp3?v=" +
                    Date.now()
                );

            audio.volume = 1;

            let finished = false;

            function done(){

                if(finished)return;

                finished = true;

                resolve();
            }

            audio.onended =
                done;

            audio.onerror =
                done;

            audio.play()
                .catch(
                    function(){

                        done();

                    }
                );

        }
    );
}


/* =========================================
   BOMB LOADER
========================================= */

function loadBomb(img){

    const names = [
        "bomb.png",
        "Bomb.png",
        "BOMB.png",
        "bomb.PNG",
        "Bomb.PNG",
        "bomb.jpeg",
        "Bomb.jpeg"
    ];

    let index = 0;

    function tryNext(){

        if(index >= names.length){

            img.remove();

            return;
        }

        const filename =
            names[index++];

        const test =
            new Image();

        test.onload =
            function(){

                img.src =
                    test.src;

                img.style.display =
                    "block";
            };

        test.onerror =
            function(){

                tryNext();
            };

        test.src =
            "./" +
            filename +
            "?v=" +
            Date.now();
    }

    tryNext();
}


/* =========================================
   START GAME
========================================= */

function startGame(){

    initAudio();

    playerName =
        nameInput.value.trim()
        ||
        "Ninja";

    score = 0;

    lives = 5;

    level = 1;

    currentIndex = 0;

    timeLeft = 10;

    shuffledAlphabet =
        shuffle(alphabet);

    running = true;

    clearInterval(timer);

    clearLetters();

    clearObstacles();

    startScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );

    winScreen.classList.add(
        "hidden"
    );

    updateHUD();

    nextRound();
}


/* =========================================
   HUD
========================================= */

function updateHUD(){

    scoreEl.textContent =
        score;

    livesEl.textContent =
        lives;

    levelEl.textContent =
        level;

    timerEl.textContent =
        timeLeft;
}


/* =========================================
   NEXT ROUND
========================================= */

function nextRound(){

    if(!running)return;

    clearLetters();

    clearObstacles();

    if(
        currentIndex >=
        shuffledAlphabet.length
    ){

        winGame();

        return;
    }

    const base =
        shuffledAlphabet[
            currentIndex
        ];

    target =
        Math.random() < .5
        ?
        base
        :
        base.toLowerCase();

    targetEl.textContent =
        target;

    timeLeft =
        Math.max(
            5,
            11 - level
        );

    createLetters();

    createObstacles();

    updateHUD();

    startTimer();

    currentIndex++;

    level =
        Math.min(
            10,
            Math.floor(
                currentIndex / 5
            ) + 1
        );

    updateHUD();
}


/* =========================================
   CREATE LETTERS
========================================= */

function createLetters(){

    const count =
        Math.min(
            6 + Math.floor(level / 2),
            10
        );

    const targetUpper =
        target.toUpperCase();

    /*
       Both capital and small
       target are always present.
    */

    const list = [
        targetUpper,
        targetUpper.toLowerCase()
    ];

    while(list.length < count){

        const wrong =
            alphabet[
                Math.floor(
                    Math.random() *
                    alphabet.length
                )
            ];

        if(
            wrong === targetUpper
        ){

            continue;
        }

        list.push(
            Math.random() < .5
            ?
            wrong
            :
            wrong.toLowerCase()
        );
    }

    const mixed =
        shuffle(list);

    mixed.forEach(
        function(display){

            createLetter(display);

        }
    );
}


/* =========================================
   CREATE LETTER
========================================= */

function createLetter(display){

    const el =
        document.createElement("div");

    el.className =
        "letter";

    /*
       One and ONLY one image
       inside each circle.
    */

    const img =
        document.createElement("img");

    img.className =
        "letterPicture";

    img.alt = "";

    img.draggable = false;

    /*
       Image starts hidden,
       but the circle itself
       is already visible.
    */

    img.style.display =
        "none";

    el.appendChild(img);

    /*
       Start image loading immediately.
    */

    loadLetterImage(
        display,
        img
    );

    const maxX =
        Math.max(
            10,
            window.innerWidth - 95
        );

    const maxY =
        Math.max(
            40,
            window.innerHeight - 260
        );

    const obj = {

        el:el,

        display:display,

        base:
            display.toUpperCase(),

        x:
            10 +
            Math.random() * maxX,

        y:
            145 +
            Math.random() * maxY,

        vx:
            (
                Math.random() < .5
                ? -1
                : 1
            ) *
            (
                .65 +
                Math.random() *
                (1 + level*.12)
            ),

        vy:
            (
                Math.random() < .5
                ? -1
                : 1
            ) *
            (
                .45 +
                Math.random() *
                (1 + level*.1)
            ),

        rotation:
            Math.random()*360,

        vr:
            (
                Math.random()-.5
            )*4,

        alive:true
    };

    game.appendChild(el);

    letters.push(obj);
}


/* =========================================
   CREATE BOMBS
   LEVEL 1 = 1
   LEVEL 2 = 2
   LEVEL 3+ = 3
========================================= */

function createObstacles(){

    const count =
        Math.min(level,3);

    for(
        let i=0;
        i<count;
        i++
    ){

        const img =
            document.createElement("img");

        img.className =
            "obstacle";

        img.style.display =
            "none";

        loadBomb(img);

        const obj = {

            el:img,

            x:
                20 +
                Math.random() *
                Math.max(
                    20,
                    window.innerWidth-80
                ),

            y:
                160 +
                Math.random() *
                Math.max(
                    20,
                    window.innerHeight-300
                ),

            vx:
                (
                    Math.random()<.5
                    ? -1
                    : 1
                ) *
                (
                    1 +
                    level*.1
                ),

            vy:
                (
                    Math.random()<.5
                    ? -1
                    : 1
                ) *
                (
                    .5 +
                    level*.08
                ),

            rotation:0,

            vr:
                (
                    Math.random()-.5
                )*6
        };

        game.appendChild(img);

        obstacles.push(obj);
    }
}


/* =========================================
   ANIMATION
========================================= */

function animate(){

    if(running){

        const w =
            window.innerWidth;

        const h =
            window.innerHeight;

        letters.forEach(
            function(obj){

                if(!obj.alive)return;

                obj.x += obj.vx;

                obj.y += obj.vy;

                obj.rotation += obj.vr;

                if(
                    obj.x < 5 ||
                    obj.x > w-90
                ){

                    obj.vx *= -1;
                }

                if(
                    obj.y < 130 ||
                    obj.y > h-220
                ){

                    obj.vy *= -1;
                }

                obj.el.style.transform =
                    `
                    translate(
                        ${obj.x}px,
                        ${obj.y}px
                    )
                    rotate(
                        ${obj.rotation}deg
                    )
                    `;
            }
        );

        obstacles.forEach(
            function(obj){

                obj.x += obj.vx;

                obj.y += obj.vy;

                obj.rotation += obj.vr;

                if(
                    obj.x < 5 ||
                    obj.x > w-70
                ){

                    obj.vx *= -1;
                }

                if(
                    obj.y < 130 ||
                    obj.y > h-220
                ){

                    obj.vy *= -1;
                }

                obj.el.style.transform =
                    `
                    translate(
                        ${obj.x}px,
                        ${obj.y}px
                    )
                    rotate(
                        ${obj.rotation}deg
                    )
                    `;
            }
        );
    }

    requestAnimationFrame(
        animate
    );
}

animate();


/* =========================================
   TIMER
========================================= */

function startTimer(){

    clearInterval(timer);

    timer =
        setInterval(
            function(){

                if(!running)return;

                timeLeft--;

                updateHUD();

                if(
                    timeLeft <= 0
                ){

                    clearInterval(timer);

                    loseLife(
                        "TIME UP!"
                    );
                }

            },
            1000
        );
}


/* =========================================
   POINTER
========================================= */

game.addEventListener(
    "pointerdown",
    function(e){

        if(
            e.target.closest(".gameButton") ||
            e.target.tagName === "INPUT"
        ){

            return;
        }

        if(!running)return;

        lastX =
            e.clientX;

        lastY =
            e.clientY;

        checkCollision(
            e.clientX,
            e.clientY
        );
    }
);


game.addEventListener(
    "pointermove",
    function(e){

        if(!running)return;

        drawSlice(
            lastX,
            lastY,
            e.clientX,
            e.clientY
        );

        lastX =
            e.clientX;

        lastY =
            e.clientY;

        checkCollision(
            e.clientX,
            e.clientY
        );
    }
);


/* =========================================
   COLLISION
========================================= */

function checkCollision(x,y){

    if(!running)return;

    letters.forEach(
        function(obj){

            if(!obj.alive)return;

            const rect =
                obj.el.getBoundingClientRect();

            const cx =
                rect.left +
                rect.width/2;

            const cy =
                rect.top +
                rect.height/2;

            const distance =
                Math.hypot(
                    x-cx,
                    y-cy
                );

            if(
                distance < 58
            ){

                sliceLetter(obj);
            }
        }
    );

    obstacles.forEach(
        function(obj){

            if(!obj.el.isConnected)
                return;

            const rect =
                obj.el.getBoundingClientRect();

            const cx =
                rect.left +
                rect.width/2;

            const cy =
                rect.top +
                rect.height/2;

            const distance =
                Math.hypot(
                    x-cx,
                    y-cy
                );

            if(
                distance < 50
            ){

                hitObstacle(obj);
            }
        }
    );
}


/* =========================================
   SLICE LETTER
========================================= */

function sliceLetter(obj){

    if(!obj.alive)return;

    obj.alive =
        false;

    sliceSound();

    obj.el.classList.add(
        "hit"
    );

    const correct =
        obj.display.toUpperCase()
        ===
        target.toUpperCase();

    if(correct){

        correctLetter(obj);

    }else{

        wrongLetter();
    }

    setTimeout(
        function(){

            if(obj.el){
                obj.el.remove();
            }

        },
        250
    );
}


/* =========================================
   CORRECT
========================================= */

async function correctLetter(obj){

    clearInterval(timer);

    correctSound();

    score +=
        10 * level;

    showMessage(
        "GREAT!"
    );

    updateHUD();

    /*
       Play voice.
       Next letter waits until
       voice is finished.
    */

    await playLetterSound(
        obj.base
    );

    if(!running)return;

    setTimeout(
        function(){

            nextRound();

        },
        250
    );
}


/* =========================================
   WRONG
========================================= */

function wrongLetter(){

    lives--;

    score =
        Math.max(
            0,
            score-5
        );

    wrongSound();

    showMessage(
        "WRONG!"
    );

    updateHUD();

    if(
        lives <= 0
    ){

        setTimeout(
            gameOver,
            500
        );
    }
}


/* =========================================
   BOMB
========================================= */

function hitObstacle(obj){

    if(!running)return;

    lives--;

    score =
        Math.max(
            0,
            score-10
        );

    wrongSound();

    showMessage(
        "OUCH!"
    );

    obj.el.remove();

    obstacles =
        obstacles.filter(
            function(item){

                return item !== obj;

            }
        );

    updateHUD();

    if(
        lives <= 0
    ){

        setTimeout(
            gameOver,
            500
        );
    }
}


/* =========================================
   SLICE LINE
========================================= */

function drawSlice(
    x1,
    y1,
    x2,
    y2
){

    const dx =
        x2-x1;

    const dy =
        y2-y1;

    const length =
        Math.sqrt(
            dx*dx +
            dy*dy
        );

    if(length < 3)return;

    const line =
        document.createElement("div");

    line.className =
        "sliceLine";

    const angle =
        Math.atan2(dy,dx) *
        180 /
        Math.PI;

    line.style.width =
        length + "px";

    line.style.left =
        x1 + "px";

    line.style.top =
        y1 + "px";

    line.style.transform =
        `rotate(${angle}deg)`;

    game.appendChild(line);

    setTimeout(
        function(){

            line.remove();

        },
        180
    );
}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text){

    message.textContent =
        text;

    message.classList.remove(
        "pop"
    );

    void message.offsetWidth;

    message.classList.add(
        "pop"
    );
}


/* =========================================
   LOSE LIFE
========================================= */

function loseLife(reason){

    if(!running)return;

    lives--;

    wrongSound();

    showMessage(
        reason
    );

    updateHUD();

    if(
        lives <= 0
    ){

        setTimeout(
            gameOver,
            500
        );

    }else{

        setTimeout(
            nextRound,
            600
        );
    }
}


/* =========================================
   GAME OVER
========================================= */

function gameOver(){

    if(!running)return;

    running =
        false;

    clearInterval(timer);

    clearLetters();

    clearObstacles();

    gameOverSound();

    document.getElementById(
        "gameOverName"
    ).textContent =
        playerName;

    document.getElementById(
        "finalScore"
    ).textContent =
        score;

    document.getElementById(
        "finalLevel"
    ).textContent =
        level;

    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =========================================
   WIN
========================================= */

function winGame(){

    running =
        false;

    clearInterval(timer);

    clearLetters();

    clearObstacles();

    tone(
        523,
        .2,
        "square",
        .2
    );

    setTimeout(
        () => {

            tone(
                659,
                .2,
                "square",
                .2
            );

        },
        150
    );

    setTimeout(
        () => {

            tone(
                784,
                .3,
                "square",
                .2
            );

        },
        300
    );

    document.getElementById(
        "winName"
    ).textContent =
        "Great job, " +
        playerName +
        "!";

    document.getElementById(
        "winScore"
    ).textContent =
        score;

    winScreen.classList.remove(
        "hidden"
    );
}


/* =========================================
   CLEAR LETTERS
========================================= */

function clearLetters(){

    letters.forEach(
        function(obj){

            if(obj.el){

                obj.el.remove();
            }
        }
    );

    letters = [];
}


/* =========================================
   CLEAR BOMBS
========================================= */

function clearObstacles(){

    obstacles.forEach(
        function(obj){

            if(obj.el){

                obj.el.remove();
            }
        }
    );

    obstacles = [];
}


/* =========================================
   BUTTONS
========================================= */

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);

document
.getElementById("againButton")
.addEventListener(
    "click",
    startGame
);

document
.getElementById("winAgainButton")
.addEventListener(
    "click",
    startGame
);


/* =========================================
   ENTER
========================================= */

nameInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            startGame();
        }
    }
);

</script>
