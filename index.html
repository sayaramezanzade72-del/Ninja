<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ninja Alphabet Adventure</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
}

body{
    background:#07111f;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(circle at 50% 20%,#243b55 0%,#141e30 48%,#050b14 100%);
}

/* =========================
   BACKGROUND
========================= */

.moon{
    position:absolute;
    width:90px;
    height:90px;
    right:8%;
    top:12%;
    border-radius:50%;
    background:#fff4b0;
    box-shadow:0 0 35px rgba(255,244,176,.55);
    z-index:2;
}

.star{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    opacity:.8;
    z-index:1;
}

.s1{left:8%;top:12%}
.s2{left:18%;top:27%}
.s3{left:31%;top:9%}
.s4{left:47%;top:22%}
.s5{left:63%;top:10%}
.s6{left:78%;top:29%}
.s7{left:90%;top:15%}
.s8{left:85%;top:42%}
.s9{left:12%;top:42%}
.s10{left:54%;top:35%}

.mountain{
    position:absolute;
    bottom:18%;
    width:0;
    height:0;
    border-left:100px solid transparent;
    border-right:100px solid transparent;
    border-bottom:170px solid #101d2e;
    z-index:3;
    opacity:.9;
}

.m1{left:0}
.m2{left:30%;transform:scale(1.25)}
.m3{right:0;transform:scale(1.1)}

.ground{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:20%;
    background:
        linear-gradient(to bottom,#183b18,#071e0b);
    z-index:5;
}

/* =========================
   CENTER NINJA
========================= */

.centerNinja{
    position:absolute;
    left:50%;
    top:47%;
    transform:translate(-50%,-50%);
    z-index:20;

    width:125px;
    height:150px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    pointer-events:none;
    filter:drop-shadow(0 8px 7px rgba(0,0,0,.55));
}

/* head */

.ninjaHead{
    position:relative;
    width:82px;
    height:82px;
    border-radius:50%;
    background:#111;
    border:4px solid #000;
}

.ninjaHead:before{
    content:"";
    position:absolute;
    left:-8px;
    right:-8px;
    top:32px;
    height:25px;
    background:#222;
    border-top:3px solid #000;
    border-bottom:3px solid #000;
}

.eye{
    position:absolute;
    width:13px;
    height:8px;
    background:#fff;
    border-radius:50%;
    top:42px;
    z-index:3;
}

.eye.left{left:18px}
.eye.right{right:18px}

.eye:after{
    content:"";
    position:absolute;
    width:5px;
    height:5px;
    background:#111;
    border-radius:50%;
    left:4px;
    top:1px;
}

/* body */

.ninjaBody{
    position:relative;
    width:72px;
    height:62px;
    margin-top:-4px;
    background:#151515;
    border-radius:22px 22px 15px 15px;
    border:4px solid #000;
}

.ninjaBelt{
    position:absolute;
    left:0;
    right:0;
    top:32px;
    height:10px;
    background:#c9a227;
}

.ninjaArm{
    position:absolute;
    width:18px;
    height:55px;
    background:#111;
    border:3px solid #000;
    border-radius:15px;
}

.ninjaArm.left{
    left:-20px;
    top:4px;
    transform:rotate(25deg);
}

.ninjaArm.right{
    right:-20px;
    top:4px;
    transform:rotate(-25deg);
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    top:8px;
    left:7px;
    right:7px;

    display:flex;
    justify-content:space-between;
    gap:5px;

    z-index:600;
}

.hudBox{
    background:white;
    border:3px solid #222;
    border-radius:12px;
    padding:6px 9px;
    font-size:13px;
    font-weight:bold;
    color:#222;
    box-shadow:0 4px 0 rgba(0,0,0,.35);
}

/* =========================
   TARGET
========================= */

#targetBox{
    position:absolute;
    top:58px;
    left:50%;
    transform:translateX(-50%);

    background:white;
    border:4px solid #222;
    border-radius:18px;

    padding:4px 25px;

    text-align:center;

    z-index:600;

    box-shadow:0 5px 0 rgba(0,0,0,.35);
}

#targetTitle{
    font-size:11px;
    font-weight:bold;
}

#target{
    font-size:46px;
    line-height:48px;
    font-weight:900;
    color:#e63946;
    text-shadow:2px 2px 0 #222;
}

/* =========================
   LETTER CIRCLES
========================= */

.letter{
    position:absolute;

    width:82px;
    height:82px;

    border-radius:50%;
    overflow:hidden;

    background:
        radial-gradient(circle at 35% 30%,#555,#222 65%,#111);

    border:4px solid rgba(255,255,255,.9);

    box-shadow:
        0 7px 0 rgba(0,0,0,.4),
        0 0 15px rgba(255,255,255,.15);

    z-index:100;

    user-select:none;
    -webkit-user-select:none;

    pointer-events:auto;

    will-change:transform;
}

.letterPicture{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    display:block;

    opacity:0;

    transition:opacity .12s ease;

    pointer-events:none;
}

.letterPicture.loaded{
    opacity:1;
}

/*
   Important:
   There is NO LETTER TEXT inside the circle.
*/

/* =========================
   BOMB
========================= */

.obstacle{
    position:absolute;

    width:64px;
    height:64px;

    object-fit:contain;

    z-index:120;

    pointer-events:none;

    filter:drop-shadow(0 5px 5px rgba(0,0,0,.55));

    will-change:transform;
}

/* =========================
   SLICE
========================= */

.sliceLine{
    position:absolute;
    height:8px;

    background:
        linear-gradient(
            to right,
            transparent,
            white,
            #baf5ff,
            white,
            transparent
        );

    border-radius:20px;

    box-shadow:
        0 0 8px white,
        0 0 18px #70eaff;

    pointer-events:none;

    z-index:800;

    animation:sliceFade .18s ease-out forwards;
}

@keyframes sliceFade{
    from{opacity:1}
    to{opacity:0}
}

/* =========================
   HIT
========================= */

.hit{
    animation:hitAnimation .22s ease-out forwards;
}

@keyframes hitAnimation{
    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.3) rotate(15deg);
    }

    100%{
        transform:scale(0);
    }
}

/* =========================
   MESSAGE
========================= */

#message{
    position:absolute;
    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

    z-index:700;

    font-size:50px;
    font-weight:900;

    color:white;

    text-shadow:4px 4px 0 #111;

    opacity:0;

    pointer-events:none;
}

.pop{
    animation:popAnimation .7s ease-out;
}

@keyframes popAnimation{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.3);
    }

    35%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.2);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-80%) scale(1);
    }
}

/* =========================
   SCREENS
========================= */

.screen{
    position:absolute;
    inset:0;

    z-index:1000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;

    color:white;
}

.screen h1{
    font-size:clamp(40px,10vw,65px);
    text-shadow:4px 4px 0 #111;
}

.screen h2{
    margin:8px 0;
}

.screen p{
    margin:5px;
}

#startScreen{
    background:
        radial-gradient(circle at center,#294867,#101a2b 65%,#050b14);
}

#gameOverScreen{
    background:
        linear-gradient(135deg,#8b0000,#3d003d);
}

#winScreen{
    background:
        linear-gradient(135deg,#00695c,#1565c0);
}

/* =========================
   NAME
========================= */

#playerName{
    width:min(320px,85vw);

    padding:14px;
    margin:18px 0;

    border:3px solid #222;
    border-radius:15px;

    font-size:20px;

    text-align:center;

    color:#222;
    background:white;

    user-select:text;
    -webkit-user-select:text;

    touch-action:auto;
}

/* =========================
   BUTTON
========================= */

.gameButton{
    border:4px solid #222;
    border-radius:20px;

    background:#ffd43b;
    color:#222;

    padding:14px 32px;

    font-size:21px;
    font-weight:bold;

    box-shadow:0 7px 0 #9b7200;

    touch-action:manipulation;
}

.gameButton:active{
    transform:translateY(6px);
    box-shadow:0 1px 0 #9b7200;
}

.hidden{
    display:none !important;
}

@media(max-height:600px){

    #targetBox{
        top:48px;
    }

    .letter{
        width:68px;
        height:68px;
    }

    .obstacle{
        width:52px;
        height:52px;
    }

    .centerNinja{
        transform:translate(-50%,-50%) scale(.8);
    }
}
</style>
</head>

<body>

<div id="game">

<!-- BACKGROUND -->

<div class="moon"></div>

<div class="star s1"></div>
<div class="star s2"></div>
<div class="star s3"></div>
<div class="star s4"></div>
<div class="star s5"></div>
<div class="star s6"></div>
<div class="star s7"></div>
<div class="star s8"></div>
<div class="star s9"></div>
<div class="star s10"></div>

<div class="mountain m1"></div>
<div class="mountain m2"></div>
<div class="mountain m3"></div>

<div class="ground"></div>

<!-- CENTER NINJA -->

<div class="centerNinja">

    <div class="ninjaHead">

<!-- START SCREEN -->

<div id="startScreen" class="screen">

    <h1>🥷 Ninja</h1>

    </p>

        id="winAgainButton"
        class="gameButton"

    </button>

</div>

<script>

/* =========================================
   ALPHABET
========================================= */

const alphabet =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");


/* =========================================
   GAME VARIABLES
========================================= */

let letters = [];
let obstacles = [];

let shuffledAlphabet = [];

let target = "A";

let score = 0;
let lives = 5;
let level = 1;
let currentIndex = 0;

let timeLeft = 10;

let timer = null;

let running = false;

let playerName = "Ninja";

let audioContext = null;

let lastX = 0;
let lastY = 0;


/* =========================================
   IMAGE CACHE

   This prevents images from appearing twice
   and helps them load before gameplay.
========================================= */

const imageCache = {};


/* =========================================
   ELEMENTS
========================================= */

const game =
document.getElementById("game");

const targetEl =
document.getElementById("target");

const scoreEl =
document.getElementById("score");

const livesEl =
document.getElementById("lives");

const levelEl =
document.getElementById("level");

const timerEl =
document.getElementById("timer");

const message =
document.getElementById("message");

const nameInput =
document.getElementById("playerName");

const startScreen =
document.getElementById("startScreen");

const gameOverScreen =
document.getElementById("gameOverScreen");

const winScreen =
document.getElementById("winScreen");


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array){

    const arr = [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];
    }

    return arr;
}


/* =========================================
   FIND IMAGE
========================================= */

function findImage(letter){

    const upper =
        letter.toUpperCase();

    if(imageCache[upper]){
        return Promise.resolve(
            imageCache[upper]
        );
    }

    const extensions = [
        "jpeg",
        "png",
        "jpg"
    ];

    return new Promise(
        function(resolve){

            let index = 0;

            function tryNext(){

                if(index >= extensions.length){

                    imageCache[upper] = null;

                    resolve(null);

                    return;
                }

                const url =
                    "./" +
                    upper +
                    "." +
                    extensions[index];

                index++;

                const test =
                    new Image();

                test.onload =
                    function(){

                        imageCache[upper] =
                            url;

                        resolve(url);
                    };

                test.onerror =
                    function(){

                        tryNext();
                    };

                test.src = url;
            }

            tryNext();
        }
    );
}


/* =========================================
   PRELOAD ALL LETTER IMAGES
========================================= */

async function preloadImages(){

    await Promise.all(
        alphabet.map(
            function(letter){

                return findImage(letter);

            }
        )
    );

    console.log(
        "All available letter images preloaded."
    );
}


/* =========================================
   AUDIO
========================================= */

function initAudio(){

    if(!audioContext){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioContext){

            audioContext =
                new AudioContext();
        }
    }

    if(
        audioContext &&
        audioContext.state === "suspended"
    ){

        audioContext.resume();
    }
}


/* =========================================
   TONE
========================================= */

function tone(
    frequency,
    duration,
    type="sine",
    volume=.25
){

    if(!audioContext)return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = type;

    osc.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime + duration
    );
}


/* =========================================
   SOUNDS
========================================= */

function sliceSound(){

    tone(
        1800,
        .12,
        "sawtooth",
        .35
    );
}

function correctSound(){

    tone(
        600,
        .1,
        "square",
        .2
    );

    setTimeout(
        function(){

            tone(
                900,
                .14,
                "square",
                .2
            );

        },
        100
    );
}

function wrongSound(){

    tone(
        120,
        .3,
        "sawtooth",
        .35
    );
}

function gameOverSound(){

    tone(
        180,
        .35,
        "sawtooth",
        .45
    );

    setTimeout(
        function(){

            tone(
                120,
                .45,
                "sawtooth",
                .45
            );

        },
        300
    );

    setTimeout(
        function(){

            tone(
                70,
                .7,
                "sawtooth",
                .45
            );

        },
        700
    );
}


/* =========================================
   LETTER VOICE
========================================= */

function playLetterSound(letter){

    const upper =
        letter.toUpperCase();

    return new Promise(
        function(resolve){

            const audio =
                new Audio(
                    "./" +
                    upper +
                    ".mp3"
                );

            audio.volume = 1;

            let doneAlready = false;

            function done(){

                if(doneAlready)return;

                doneAlready = true;

                resolve();
            }

            audio.onended = done;
            audio.onerror = done;

            audio.play()
                .catch(
                    function(){

                        done();

                    }
                );
        }
    );
}


/* =========================================
   UPDATE HUD
========================================= */

function updateHUD(){

    scoreEl.textContent =
        score;

    livesEl.textContent =
        lives;

    levelEl.textContent =
        level;

    timerEl.textContent =
        timeLeft;
}


/* =========================================
   START GAME
========================================= */

async function startGame(){

    initAudio();

    playerName =
        nameInput.value.trim()
        ||
        "Ninja";

    score = 0;
    lives = 5;
    level = 1;
    currentIndex = 0;

    shuffledAlphabet =
        shuffle(alphabet);

    running = true;

    clearInterval(timer);

    clearLetters();

    clearObstacles();

    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    winScreen.classList.add("hidden");

    updateHUD();

    /*
       Images are already cached after first game.
       We also preload before the first round.
    */

    await preloadImages();

    if(!running)return;

    nextRound();
}


/* =========================================
   NEXT ROUND
========================================= */

function nextRound(){

    if(!running)return;

    clearInterval(timer);

    clearLetters();

    clearObstacles();

    if(
        currentIndex >=
        shuffledAlphabet.length
    ){

        winGame();

        return;
    }

    const base =
        shuffledAlphabet[currentIndex];

    target =
        Math.random() < .5
        ?
        base
        :
        base.toLowerCase();

    /*
       THE TARGET LETTER REMAINS
       AT THE TOP.
    */

    targetEl.textContent =
        target;

    timeLeft =
        Math.max(
            5,
            11 - level
        );

    createLetters();

    createObstacles();

    updateHUD();

    startTimer();

    currentIndex++;

    level =
        Math.min(
            10,
            Math.floor(
                currentIndex / 5
            ) + 1
        );

    updateHUD();
}


/* =========================================
   CREATE LETTERS
========================================= */

function createLetters(){

    const count =
        Math.min(
            6 + Math.floor(level / 2),
            10
        );

    const targetUpper =
        target.toUpperCase();

    const list = [
        targetUpper,
        targetUpper.toLowerCase()
    ];

    while(
        list.length < count
    ){

        const wrong =
            alphabet[
                Math.floor(
                    Math.random() *
                    alphabet.length
                )
            ];

        if(
            wrong === targetUpper
        ){
            continue;
        }

        list.push(wrong);
    }

    const mixed =
        shuffle(list);

    mixed.forEach(
        function(display,index){

            createLetter(
                display,
                index
            );

        }
    );
}


/* =========================================
   CREATE ONE IMAGE CIRCLE
========================================= */

function createLetter(
    display,
    index
){

    const el =
        document.createElement("div");

    el.className =
        "letter";

    /*
       NO TEXT IS ADDED HERE.
    */

    const img =
        document.createElement("img");

    img.className =
        "letterPicture";

    img.alt = "";

    const upper =
        display.toUpperCase();

    /*
       Use the already preloaded URL.
    */

    const cached =
        imageCache[upper];

    if(cached){

        img.src = cached;

        img.onload =
            function(){

                img.classList.add("loaded");

            };

    }

    /*
       If an image doesn't exist,
       keep the circle visible.
    */

    el.appendChild(img);

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;

    const size = 82;

    const safeTop = 150;

    const safeBottom = 170;

    const maxX =
        Math.max(
            10,
            w - size - 10
        );

    const maxY =
        Math.max(
            safeTop,
            h - safeBottom
        );

    const obj = {

        el:el,

        display:display,

        base:upper,

        x:
            10 +
            Math.random()*maxX,

        y:
            safeTop +
            Math.random() *
            Math.max(
                20,
                maxY-safeTop
            ),

        /*
           Medium speed.
        */

        vx:
            (
                Math.random()<.5
                ? -1
                : 1
            ) *
            (
                .8 +
                Math.random() *
                .65 +
                level*.04
            ),

        vy:
            (
                Math.random()<.5
                ? -1
                : 1
            ) *
            (
                .65 +
                Math.random() *
                .55 +
                level*.035
            ),

        rotation:
            Math.random()*360,

        vr:
            (Math.random()-.5)*3,

        alive:true
    };

    game.appendChild(el);

    letters.push(obj);
}


/* =========================================
   BOMB
========================================= */

function loadObstacle(img){

    const names = [
        "bomb.png",
        "Bomb.png",
        "BOMB.png",
        "bomb.PNG",
        "Bomb.PNG",
        "bomb.jpeg",
        "Bomb.jpeg"
    ];

    let index = 0;

    function tryNext(){

        if(index >= names.length){
            return;
        }

        const filename =
            names[index++];

        img.onload =
            function(){

                img.style.display =
                    "block";

            };

        img.onerror =
            function(){

                tryNext();

            };

        img.src =
            "./" +
            filename;
    }

    tryNext();
}


/* =========================================
   CREATE BOMBS
========================================= */

function createObstacles(){

    /*
       Level 1 = 1
       Level 2 = 2
       Level 3+ = 3
    */

    const count =
        Math.min(level,3);

    for(
        let i=0;
        i<count;
        i++
    ){

        const img =
            document.createElement("img");

        img.className =
            "obstacle";

        img.style.display =
            "none";

        loadObstacle(img);

        const w =
            window.innerWidth;

        const h =
            window.innerHeight;

        const obj = {

            el:img,

            x:
                20 +
                Math.random() *
                Math.max(
                    20,
                    w-80
                ),

            y:
                170 +
                Math.random() *
                Math.max(
                    20,
                    h-310
                ),

            vx:
                (
                    Math.random()<.5
                    ? -1
                    : 1
                ) *
                (
                    .8 +
                    level*.08
                ),

            vy:
                (
                    Math.random()<.5
                    ? -1
                    : 1
                ) *
                (
                    .6 +
                    level*.06
                ),

            rotation:0,

            vr:
                (Math.random()-.5)*5
        };

        game.appendChild(img);

        obstacles.push(obj);
    }
}


/* =========================================
   ANIMATION
========================================= */

function animate(){

    if(running){

        const w =
            window.innerWidth;

        const h =
            window.innerHeight;

        letters.forEach(
            function(obj){

                if(!obj.alive)return;

                obj.x += obj.vx;
                obj.y += obj.vy;

                obj.rotation += obj.vr;

                if(
                    obj.x < 5 ||
                    obj.x > w-87
                ){

                    obj.vx *= -1;
                }

                if(
                    obj.y < 135 ||
                    obj.y > h-190
                ){

                    obj.vy *= -1;
                }

                obj.el.style.transform =
                    `
                    translate(
                        ${obj.x}px,
                        ${obj.y}px
                    )
                    rotate(
                        ${obj.rotation}deg
                    )
                    `;
            }
        );

        obstacles.forEach(
            function(obj){

                obj.x += obj.vx;
                obj.y += obj.vy;

                obj.rotation += obj.vr;

                if(
                    obj.x < 5 ||
                    obj.x > w-70
                ){

                    obj.vx *= -1;
                }

                if(
                    obj.y < 135 ||
                    obj.y > h-190
                ){

                    obj.vy *= -1;
                }

                obj.el.style.transform =
                    `
                    translate(
                        ${obj.x}px,
                        ${obj.y}px
                    )
                    rotate(
                        ${obj.rotation}deg
                    )
                    `;
            }
        );
    }

    requestAnimationFrame(animate);
}

animate();


/* =========================================
   TIMER
========================================= */

function startTimer(){

    clearInterval(timer);

    timer =
        setInterval(
            function(){

                if(!running)return;

                timeLeft--;

                updateHUD();

                if(
                    timeLeft <= 0
                ){

                    clearInterval(timer);

                    loseLife(
                        "TIME UP!"
                    );
                }

            },
            1000
        );
}


/* =========================================
   POINTER
========================================= */

game.addEventListener(
    "pointerdown",
    function(e){

        if(
            e.target.closest(".gameButton") ||
            e.target.tagName === "INPUT"
        ){

            return;
        }

        if(!running)return;

        lastX = e.clientX;
        lastY = e.clientY;

        checkCollision(
            e.clientX,
            e.clientY
        );
    }
);


game.addEventListener(
    "pointermove",
    function(e){

        if(!running)return;

        drawSlice(
            lastX,
            lastY,
            e.clientX,
            e.clientY
        );

        lastX = e.clientX;
        lastY = e.clientY;

        checkCollision(
            e.clientX,
            e.clientY
        );
    }
);


/* =========================================
   COLLISION
========================================= */

function checkCollision(x,y){

    if(!running)return;

    letters.forEach(
        function(obj){

            if(!obj.alive)return;

            const rect =
                obj.el.getBoundingClientRect();

            const cx =
                rect.left +
                rect.width/2;

            const cy =
                rect.top +
                rect.height/2;

            const distance =
                Math.hypot(
                    x-cx,
                    y-cy
                );

            if(distance < 55){

                sliceLetter(obj);
            }
        }
    );

    obstacles.forEach(
        function(obj){

            const rect =
                obj.el.getBoundingClientRect();

            const cx =
                rect.left +
                rect.width/2;

            const cy =
                rect.top +
                rect.height/2;

            const distance =
                Math.hypot(
                    x-cx,
                    y-cy
                );

            if(distance < 50){

                hitObstacle(obj);
            }
        }
    );
}


/* =========================================
   SLICE LETTER
========================================= */

function sliceLetter(obj){

    if(!obj.alive)return;

    obj.alive = false;

    sliceSound();

    obj.el.classList.add("hit");

    const correct =
        obj.base ===
        target.toUpperCase();

    if(correct){

        correctLetter(obj);

    }else{

        wrongLetter();
    }

    setTimeout(
        function(){

            if(obj.el){
                obj.el.remove();
            }

        },
        230
    );
}


/* =========================================
   CORRECT LETTER
========================================= */

async function correctLetter(obj){

    clearInterval(timer);

    correctSound();

    score +=
        10 * level;

    showMessage("GREAT!");

    updateHUD();

    /*
       Voice plays completely
       before next letter appears.
    */

    await playLetterSound(
        obj.base
    );

    if(!running)return;

    setTimeout(
        function(){

            nextRound();

        },
        300
    );
}


/* =========================================
   WRONG
========================================= */

function wrongLetter(){

    lives--;

    score =
        Math.max(
            0,
            score-5
        );

    wrongSound();

    showMessage("WRONG!");

    updateHUD();

    if(lives <= 0){

        setTimeout(
            gameOver,
            500
        );
    }
}


/* =========================================
   BOMB HIT
========================================= */

function hitObstacle(obj){

    if(!running)return;

    lives--;

    score =
        Math.max(
            0,
            score-10
        );

    wrongSound();

    showMessage("OUCH!");

    obj.el.remove();

    obstacles =
        obstacles.filter(
            function(item){

                return item !== obj;

            }
        );

    updateHUD();

    if(lives <= 0){

        setTimeout(
            gameOver,
            500
        );
    }
}


/* =========================================
   SLICE LINE
========================================= */

function drawSlice(
    x1,y1,x2,y2
){

    const dx = x2-x1;
    const dy = y2-y1;

    const length =
        Math.sqrt(
            dx*dx + dy*dy
        );

    if(length < 3)return;

    const line =
        document.createElement("div");

    line.className =
        "sliceLine";

    const angle =
        Math.atan2(dy,dx) *
        180 / Math.PI;

    line.style.width =
        length + "px";

    line.style.left =
        x1 + "px";

    line.style.top =
        y1 + "px";

    line.style.transform =
        `rotate(${angle}deg)`;

    game.appendChild(line);

    setTimeout(
        function(){

            line.remove();

        },
        180
    );
}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text){

    message.textContent =
        text;

    message.classList.remove("pop");

    void message.offsetWidth;

    message.classList.add("pop");
}


/* =========================================
   LOSE LIFE
========================================= */

function loseLife(reason){

    if(!running)return;

    lives--;

    wrongSound();

    showMessage(reason);

    updateHUD();

    if(lives <= 0){

        setTimeout(
            gameOver,
            500
        );

    }else{

        setTimeout(
            nextRound,
            600
        );
    }
}


/* =========================================
   GAME OVER
========================================= */

function gameOver(){

    if(!running)return;

    running = false;

    clearInterval(timer);

    clearLetters();

    clearObstacles();

    gameOverSound();

    document.getElementById(
        "gameOverName"
    ).textContent =
        playerName;

    document.getElementById(
        "finalScore"
    ).textContent =
        score;

    document.getElementById(
        "finalLevel"
    ).textContent =
        level;

    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =========================================
   WIN
========================================= */

function winGame(){

    running = false;

    clearInterval(timer);

    clearLetters();

    clearObstacles();

    tone(
        523,
        .2,
        "square",
        .2
    );

    setTimeout(
        function(){

            tone(
                659,
                .2,
                "square",
                .2
            );

        },
        150
    );

    setTimeout(
        function(){

            tone(
                784,
                .3,
                "square",
                .2
            );

        },
        300
    );

    document.getElementById(
        "winName"
    ).textContent =
        "Great job, " +
        playerName +
        "!";

    document.getElementById(
        "winScore"
    ).textContent =
        score;

    winScreen.classList.remove(
        "hidden"
    );
}


/* =========================================
   CLEAR LETTERS
========================================= */

function clearLetters(){

    letters.forEach(
        function(obj){

            if(obj.el){
                obj.el.remove();
            }

        }
    );

    letters = [];
}


/* =========================================
   CLEAR BOMBS
========================================= */

function clearObstacles(){

    obstacles.forEach(
        function(obj){

            if(obj.el){
                obj.el.remove();
            }

        }
    );

    obstacles = [];
}


/* =========================================
   BUTTONS
========================================= */

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);

document
.getElementById("againButton")
.addEventListener(
    "click",
    startGame
);

document
.getElementById("winAgainButton")
.addEventListener(
    "click",
    startGame
);


/* =========================================
   ENTER
========================================= */

nameInput.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            startGame();

        }

    }
);

</script>
