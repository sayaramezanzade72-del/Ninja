<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ninja Alphabet Adventure</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
}

body{
    background:#07111f;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 15%,
            #263f5c 0%,
            #142b46 35%,
            #081526 70%,
            #030911 100%
        );
}

/* =========================
   MOON
========================= */

.moon{
    position:absolute;

    width:90px;
    height:90px;

    right:8%;
    top:11%;

    border-radius:50%;

    background:#fff4bd;

    box-shadow:
        0 0 20px #fff4bd,
        0 0 50px rgba(255,244,189,.45);

    z-index:1;
}

/* =========================
   STARS
========================= */

.star{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 6px white;

    opacity:.8;

    z-index:1;
}

.star1{left:7%;top:10%}
.star2{left:18%;top:25%}
.star3{left:31%;top:9%}
.star4{left:46%;top:20%}
.star5{left:62%;top:8%}
.star6{left:77%;top:28%}
.star7{left:88%;top:12%}
.star8{left:12%;top:42%}
.star9{left:55%;top:34%}
.star10{left:72%;top:43%}
.star11{left:92%;top:38%}

/* =========================
   MOUNTAINS
========================= */

.mountain{
    position:absolute;

    bottom:19%;

    width:0;
    height:0;

    border-left:120px solid transparent;
    border-right:120px solid transparent;
    border-bottom:190px solid #0a1d2b;

    opacity:.9;

    z-index:2;
}

.m1{
    left:-70px;
}

.m2{
    left:22%;
    transform:scale(1.25);
}

.m3{
    right:-70px;
    transform:scale(1.1);
}

/* =========================
   GROUND
========================= */

.ground{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:22%;

    background:
        linear-gradient(
            to bottom,
            #173b29,
            #0b2419
        );

    border-top:
        3px solid #28583a;

    z-index:3;
}

/* =========================
   NINJA
========================= */

.ninja{
    position:absolute;

    left:50%;

    bottom:5%;

    transform:
        translateX(-50%);

    font-size:
        clamp(55px,14vw,95px);

    line-height:1;

    z-index:25;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(0,0,0,.7)
        );

    pointer-events:none;

    animation:
        ninjaFloat 2s
        ease-in-out
        infinite;
}

@keyframes ninjaFloat{

    0%,100%{
        transform:
            translateX(-50%)
            translateY(0);
    }

    50%{
        transform:
            translateX(-50%)
            translateY(-5px);
    }
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;

    top:8px;
    left:7px;
    right:7px;

    display:flex;

    justify-content:space-between;

    gap:5px;

    z-index:500;
}

.hudBox{
    background:white;

    border:3px solid #222;

    border-radius:12px;

    padding:6px 9px;

    font-size:13px;

    font-weight:bold;

    color:#222;

    box-shadow:
        0 4px 0 rgba(0,0,0,.35);
}

/* =========================
   TARGET
========================= */

#targetBox{
    position:absolute;

    top:58px;
    left:50%;

    transform:
        translateX(-50%);

    background:white;

    border:4px solid #222;

    border-radius:18px;

    padding:4px 25px;

    text-align:center;

    z-index:500;

    box-shadow:
        0 5px 0 rgba(0,0,0,.35);

    min-width:125px;
}

#targetTitle{
    font-size:11px;

    font-weight:bold;

    color:#222;
}

#target{
    font-size:46px;

    line-height:48px;

    font-weight:900;

    color:#e63946;

    text-shadow:
        2px 2px 0 #222;
}

/* =========================
   LETTER CIRCLE
========================= */

.letter{
    position:absolute;

    width:78px;
    height:78px;

    border-radius:50%;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #eeeeee 100%
        );

    border:none;

    box-shadow:
        0 7px 0 rgba(0,0,0,.35),
        0 0 12px rgba(255,255,255,.25);

    z-index:100;

    user-select:none;
    -webkit-user-select:none;

    pointer-events:auto;
}

/* =========================
   LETTER IMAGE
========================= */

.letterPicture{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    border:none;

    padding:0;
    margin:0;

    display:block;

    opacity:0;

    transition:
        opacity .15s ease;
}

/* =========================
   LOADING
========================= */

.letter.loading{
    background:
        radial-gradient(
            circle,
            #ffffff,
            #cfd8dc
        );
}

/* =========================
   HIT
========================= */

.hit{
    animation:
        hitAnimation .25s
        ease-out
        forwards;
}

@keyframes hitAnimation{

    0%{
        transform:scale(1);
    }

    50%{
        transform:
            scale(1.35)
            rotate(15deg);
    }

    100%{
        transform:scale(0);
    }
}

/* =========================
   SLICE
========================= */

.sliceLine{
    position:absolute;

    height:8px;

    background:
        linear-gradient(
            to right,
            transparent,
            white,
            #baf5ff,
            white,
            transparent
        );

    border-radius:20px;

    box-shadow:
        0 0 8px white,
        0 0 18px #70eaff;

    pointer-events:none;

    z-index:800;

    animation:
        sliceFade .18s
        ease-out forwards;
}

@keyframes sliceFade{

    from{
        opacity:1;
    }

    to{
        opacity:0;
    }
}

/* =========================
   MESSAGE
========================= */

#message{
    position:absolute;

    left:50%;
    top:45%;

    transform:
        translate(-50%,-50%);

    z-index:700;

    font-size:50px;

    font-weight:900;

    color:white;

    text-shadow:
        4px 4px 0 #111;

    opacity:0;

    pointer-events:none;
}

.pop{
    animation:
        popAnimation .7s
        ease-out;
}

@keyframes popAnimation{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.3);
    }

    35%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.2);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-80%)
            scale(1);
    }
}

/* =========================
   BOMBS
========================= */

.obstacle{
    position:absolute;

    width:64px;
    height:64px;

    object-fit:contain;

    z-index:120;

    pointer-events:none;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,.55)
        );
}

/* =========================
   SCREENS
========================= */

.screen{
    position:absolute;

    inset:0;

    z-index:1000;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:20px;

    color:white;
}

.screen h1{
    font-size:
        clamp(40px,10vw,65px);

    text-shadow:
        4px 4px 0 #111;
}

.screen h2{
    margin:8px 0;
}

.screen p{
    margin:5px;
}

/* =========================
   START SCREEN
========================= */

#startScreen{

    background:
        radial-gradient(
            circle at 50% 30%,
            #29496b,
            #0c1d31 55%,
            #030811
        );
}

/* =========================
   GAME OVER
========================= */

#gameOverScreen{

    background:
        linear-gradient(
            135deg,
            #8b0000,
            #260016
        );
}

/* =========================
   WIN
========================= */

#winScreen{

    background:
        linear-gradient(
            135deg,
            #00695c,
            #073b73
        );
}

/* =========================
   NAME
========================= */

#playerName{

    width:min(320px,85vw);

    padding:14px;

    margin:18px 0;

    border:3px solid #222;

    border-radius:15px;

    font-size:20px;

    text-align:center;

    color:#222;

    background:white;

    user-select:text;

    -webkit-user-select:text;

    touch-action:auto;
}

/* =========================
   BUTTON
========================= */

.gameButton{

    border:4px solid #222;

    border-radius:20px;

    background:#ffd43b;

    color:#222;

    padding:14px 32px;

    font-size:21px;

    font-weight:bold;

    box-shadow:
        0 7px 0 #9b7200;

    touch-action:manipulation;
}

.gameButton:active{

    transform:
        translateY(6px);

    box-shadow:
        0 1px 0 #9b7200;
}

.hidden{
    display:none !important;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-height:600px){

    #targetBox{
        top:48px;
    }

    .letter{
        width:65px;
        height:65px;
    }

    .obstacle{
        width:55px;
        height:55px;
    }

    .ninja{
        bottom:3%;
        font-size:60px;
    }
}

</style>
</head>

<body>

<div id="game">

    <!-- STARS -->

    <div class="star star1"></div>
    <div class="star star2"></div>
    <div class="star star3"></div>
    <div class="star star4"></div>
    <div class="star star5"></div>
    <div class="star star6"></div>
    <div class="star star7"></div>
    <div class="star star8"></div>
    <div class="star star9"></div>
    <div class="star star10"></div>
    <div class="star star11"></div>

    <!-- MOON -->

    <div class="moon"></div>

    <!-- MOUNTAINS -->

    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>

    <!-- GROUND -->

    <div class="ground"></div>

    <div class="ninja">🥷</div>

    <div id="hud">

        <div class="hudBox">

    <div id="targetBox">

        </div>

        </div>

            autocomplete="off">

            id="winAgainButton"
            class="gameButton"

        <p style="margin-top:15px;">

        </p>

</div>

<script>

/* =========================================
   ALPHABET
========================================= */

const alphabet =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

/* =========================================
   VARIABLES
========================================= */

let letters = [];

let obstacles = [];

let shuffledAlphabet = [];

let target = "A";

let score = 0;

let lives = 5;

let level = 1;

let currentIndex = 0;

let timeLeft = 10;

let timer = null;

let running = false;

let playerName = "Ninja";

let audioContext = null;

let lastX = 0;

let lastY = 0;

/* =========================================
   ELEMENTS
========================================= */

const game =
document.getElementById("game");

const targetEl =
document.getElementById("target");

const scoreEl =
document.getElementById("score");

const livesEl =
document.getElementById("lives");

const levelEl =
document.getElementById("level");

const timerEl =
document.getElementById("timer");

const message =
document.getElementById("message");

const nameInput =
document.getElementById("playerName");

const startScreen =
document.getElementById("startScreen");

const gameOverScreen =
document.getElementById("gameOverScreen");

const winScreen =
document.getElementById("winScreen");

/* =========================================
   SHUFFLE
========================================= */

function shuffle(array){

    const arr = [...array];

    for(
        let i = arr.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];
    }

    return arr;
}

/* =========================================
   AUDIO
========================================= */

function initAudio(){

    if(!audioContext){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioContext){

            audioContext =
                new AudioContext();
        }
    }

    if(
        audioContext &&
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();
    }
}

/* =========================================
   TONE
========================================= */

function tone(
    frequency,
    duration,
    type="sine",
    volume=.25
){

    if(!audioContext)return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = type;

    osc.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime + duration
    );
}

/* =========================================
   SLICE SOUND
========================================= */

function sliceSound(){

    if(!audioContext)return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type =
        "sawtooth";

    osc.frequency.setValueAtTime(
        1800,
        audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        150,
        audioContext.currentTime + .12
    );

    gain.gain.setValueAtTime(
        .35,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + .12
    );

    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );

    osc.start();

    osc.stop(
        audioContext.currentTime + .12
    );
}

/* =========================================
   CORRECT SOUND
========================================= */

function correctSound(){

    tone(
        600,
        .1,
        "square",
        .2
    );

    setTimeout(
        function(){

            tone(
                900,
                .14,
                "square",
                .2
            );

        },
        100
    );
}

/* =========================================
   WRONG SOUND
========================================= */

function wrongSound(){

    tone(
        120,
        .3,
        "sawtooth",
        .35
    );
}

/* =========================================
   GAME OVER SOUND
========================================= */

function gameOverSound(){

    tone(
        180,
        .35,
        "sawtooth",
        .45
    );

    setTimeout(
        function(){

            tone(
                120,
                .45,
                "sawtooth",
                .45
            );

        },
        300
    );

    setTimeout(
        function(){

            tone(
                70,
                .7,
                "sawtooth",
                .45
            );

        },
        700
    );
}

/* =========================================
   IMPROVED IMAGE LOADER
========================================= */

function loadLetterImage(letter,img,container){

    const upper =
        letter.toUpperCase();

    const extensions = [
        "jpeg",
        "png",
        "jpg"
    ];

    let index = 0;

    let loaded = false;

    img.style.display =
        "block";

    img.style.opacity =
        "0";

    container.classList.add(
        "loading"
    );

    function tryNext(){

        if(
            index >=
            extensions.length
        ){

            console.log(
                "IMAGE NOT FOUND:",
                upper
            );

            /*
             * Keep a clean circle
             * instead of showing
             * a broken image.
             */

            img.style.display =
                "none";

            container.classList.remove(
                "loading"
            );

            return;
        }

        const filename =
            upper +
            "." +
            extensions[index];

        index++;

        const test =
            new Image();

        test.onload =
            function(){

                if(loaded)return;

                loaded = true;

                img.src =
                    test.src;

                img.style.display =
                    "block";

                img.style.opacity =
                    "1";

                container.classList.remove(
                    "loading"
                );

                console.log(
                    "IMAGE LOADED:",
                    filename
                );
            };

        test.onerror =
            function(){

                tryNext();
            };

        /*
         * Cache-busting
         */

        test.src =
            "./" +
            filename +
            "?v=" +
            Date.now();
    }

    tryNext();
}

/* =========================================
   LETTER AUDIO
========================================= */

function playLetterSound(letter){

    const upper =
        letter.toUpperCase();

    return new Promise(
        function(resolve){

            const audio =
                new Audio(
                    "./" +
                    upper +
                    ".mp3?v=" +
                    Date.now()
                );

            audio.volume = 1;

            let finished =
                false;

            function done(){

                if(finished)return;

                finished = true;

                resolve();
            }

            audio.onended =
                done;

            audio.onerror =
                done;

            audio.play()
                .catch(
                    function(){

                        done();

                    }
                );
        }
    );
}

/* =========================================
   OBSTACLE LOADER
========================================= */

function loadObstacle(names,img){

    let index = 0;

    function tryNext(){

        if(
            index >=
            names.length
        ){

            img.style.display =
                "none";

            return;
        }

        const filename =
            names[index];

        index++;

        const test =
            new Image();

        test.onload =
            function(){

                img.src =
                    test.src;

                img.style.display =
                    "block";
            };

        test.onerror =
            function(){

                tryNext();

            };

        test.src =
            "./" +
            filename +
            "?v=" +
            Date.now();
    }

    tryNext();
}

/* =========================================
   START GAME
========================================= */

function startGame(){

    initAudio();

    playerName =
        nameInput.value.trim()
        ||
        "Ninja";

    score = 0;

    lives = 5;

    level = 1;

    currentIndex = 0;

    shuffledAlphabet =
        shuffle(alphabet);

    running = true;

    clearLetters();

    clearObstacles();

    startScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );

    winScreen.classList.add(
        "hidden"
    );

    updateHUD();

    nextRound();
}

/* =========================================
   HUD
========================================= */

function updateHUD(){

    scoreEl.textContent =
        score;

    livesEl.textContent =
        lives;

    levelEl.textContent =
        level;

    timerEl.textContent =
        timeLeft;
}

/* =========================================
   NEXT ROUND
========================================= */

function nextRound(){

    if(!running)return;

    clearLetters();

    clearObstacles();

    if(
        currentIndex >=
        shuffledAlphabet.length
    ){

        winGame();

        return;
    }

    const base =
        shuffledAlphabet[
            currentIndex
        ];

    /*
     * Target can be
     * capital or small.
     */

    target =
        Math.random() < .5
        ?
        base
        :
        base.toLowerCase();

    /*
     * KEEP SAMPLE LETTER
     */

    targetEl.textContent =
        target;

    timeLeft =
        Math.max(
            5,
            11 - level
        );

    createLetters();

    createObstacles();

    updateHUD();

    startTimer();

    currentIndex++;

    level =
        Math.min(
            10,
            Math.floor(
                currentIndex / 5
            ) + 1
        );

    updateHUD();
}

/* =========================================
   CREATE LETTERS
========================================= */

function createLetters(){

    const count =
        Math.min(
            6 +
            Math.floor(level / 2),
            10
        );

    const targetUpper =
        target.toUpperCase();

    /*
     * Always show
     * Capital + Small.
     */

    const list = [

        targetUpper,

        targetUpper.toLowerCase()

    ];

    while(
        list.length < count
    ){

        const wrong =
            alphabet[
                Math.floor(
                    Math.random() *
                    alphabet.length
                )
            ];

        if(
            wrong ===
            targetUpper
        ){

            continue;
        }

        list.push(
            Math.random() < .5
            ?
            wrong
            :
            wrong.toLowerCase()
        );
    }

    const mixed =
        shuffle(list);

    mixed.forEach(
        function(display,index){

            createLetter(
                display,
                index
            );
        }
    );
}

/* =========================================
   CREATE LETTER
========================================= */

function createLetter(
    display,
    index
){

    const el =
        document.createElement(
            "div"
        );

    el.className =
        "letter";

    const img =
        document.createElement(
            "img"
        );

    img.className =
        "letterPicture";

    /*
     * Append first,
     * then start loading.
     */

    el.appendChild(img);

    game.appendChild(el);

    loadLetterImage(
        display,
        img,
        el
    );

    const maxX =
        Math.max(
            10,
            window.innerWidth - 90
        );

    /*
     * Keep letters away
     * from bottom ninja.
     */

    const maxY =
        Math.max(
            40,
            window.innerHeight - 300
        );

    const obj = {

        el:el,

        display:display,

        base:
            display.toUpperCase(),

        x:
            10 +
            Math.random() *
            maxX,

        y:
            145 +
            Math.random() *
            maxY,

        vx:
            (
                Math.random() < .5
                ?
                -1
                :
                1
            ) *
            (
                .65 +
                Math.random() *
                (1 + level*.12)
            ),

        vy:
            (
                Math.random() < .5
                ?
                -1
                :
                1
            ) *
            (
                .45 +
                Math.random() *
                (1 + level*.1)
            ),

        rotation:
            Math.random()*360,

        vr:
            (
                Math.random()-.5
            )*4,

        alive:true
    };

    letters.push(obj);
}

/* =========================================
   CREATE BOMBS
   LEVEL 1 = 1
   LEVEL 2 = 2
   LEVEL 3+ = 3
========================================= */

function createObstacles(){

    const count =
        Math.min(
            level,
            3
        );

    for(
        let i=0;
        i<count;
        i++
    ){

        const img =
            document.createElement(
                "img"
            );

        img.className =
            "obstacle";

        loadObstacle(
            [
                "bomb.png",
                "Bomb.png",
                "BOMB.png",
                "bomb.PNG",
                "Bomb.PNG",
                "bomb.jpeg",
                "Bomb.jpeg",
                "bomb.jpg",
                "Bomb.jpg"
            ],
            img
        );

        const obj = {

            el:img,

            x:
                20 +
                Math.random() *
                Math.max(
                    20,
                    window.innerWidth-80
                ),

            y:
                160 +
                Math.random() *
                Math.max(
                    20,
                    window.innerHeight-320
                ),

            vx:
                (
                    Math.random()<.5
                    ?
                    -1
                    :
                    1
                ) *
                (
                    1 +
                    level*.1
                ),

            vy:
                (
                    Math.random()<.5
                    ?
                    -1
                    :
                    1
                ) *
                (
                    .5 +
                    level*.08
                ),

            rotation:0,

            vr:
                (
                    Math.random()-.5
                )*6
        };

        game.appendChild(img);

        obstacles.push(obj);
    }
}

/* =========================================
   ANIMATION
========================================= */

function animate(){

    if(running){

        const w =
            window.innerWidth;

        const h =
            window.innerHeight;

        letters.forEach(
            function(obj){

                if(!obj.alive)return;

                obj.x += obj.vx;

                obj.y += obj.vy;

                obj.rotation += obj.vr;

                if(
                    obj.x < 5 ||
                    obj.x > w-90
                ){

                    obj.vx *= -1;
                }

                if(
                    obj.y < 130 ||
                    obj.y > h-280
                ){

                    obj.vy *= -1;
                }

                obj.el.style.transform =
                    `
                    translate(
                        ${obj.x}px,
                        ${obj.y}px
                    )
                    rotate(
                        ${obj.rotation}deg
                    )
                    `;
            }
        );

        obstacles.forEach(
            function(obj){

                obj.x += obj.vx;

                obj.y += obj.vy;

                obj.rotation += obj.vr;

                if(
                    obj.x < 5 ||
                    obj.x > w-70
                ){

                    obj.vx *= -1;
                }

                if(
                    obj.y < 130 ||
                    obj.y > h-280
                ){

                    obj.vy *= -1;
                }

                obj.el.style.transform =
                    `
                    translate(
                        ${obj.x}px,
                        ${obj.y}px
                    )
                    rotate(
                        ${obj.rotation}deg
                    )
                    `;
            }
        );
    }

    requestAnimationFrame(
        animate
    );
}

animate();

/* =========================================
   TIMER
========================================= */

function startTimer(){

    clearInterval(timer);

    timer =
        setInterval(
            function(){

                if(!running)return;

                timeLeft--;

                updateHUD();

                if(
                    timeLeft <= 0
                ){

                    clearInterval(timer);

                    loseLife(
                        "TIME UP!"
                    );
                }

            },
            1000
        );
}

/* =========================================
   POINTER DOWN
========================================= */

game.addEventListener(
    "pointerdown",
    function(e){

        if(
            e.target.closest(
                ".gameButton"
            ) ||
            e.target.tagName ===
            "INPUT"
        ){

            return;
        }

        if(!running)return;

        lastX =
            e.clientX;

        lastY =
            e.clientY;

        checkCollision(
            e.clientX,
            e.clientY
        );
    }
);

/* =========================================
   POINTER MOVE
========================================= */

game.addEventListener(
    "pointermove",
    function(e){

        if(!running)return;

        drawSlice(
            lastX,
            lastY,
            e.clientX,
            e.clientY
        );

        lastX =
            e.clientX;

        lastY =
            e.clientY;

        checkCollision(
            e.clientX,
            e.clientY
        );
    }
);

/* =========================================
   COLLISION
========================================= */

function checkCollision(x,y){

    if(!running)return;

    letters.forEach(
        function(obj){

            if(!obj.alive)return;

            const rect =
                obj.el.getBoundingClientRect();

            const cx =
                rect.left +
                rect.width/2;

            const cy =
                rect.top +
                rect.height/2;

            const distance =
                Math.hypot(
                    x-cx,
                    y-cy
                );

            if(
                distance < 55
            ){

                sliceLetter(obj);
            }
        }
    );

    obstacles.forEach(
        function(obj){

            const rect =
                obj.el.getBoundingClientRect();

            const cx =
                rect.left +
                rect.width/2;

            const cy =
                rect.top +
                rect.height/2;

            const distance =
                Math.hypot(
                    x-cx,
                    y-cy
                );

            if(
                distance < 50
            ){

                hitObstacle(obj);
            }
        }
    );
}

/* =========================================
   SLICE LETTER
========================================= */

function sliceLetter(obj){

    if(!obj.alive)return;

    obj.alive =
        false;

    sliceSound();

    obj.el.classList.add(
        "hit"
    );

    const correct =
        obj.display.toUpperCase()
        ===
        target.toUpperCase();

    if(correct){

        correctLetter(obj);

    }else{

        wrongLetter();
    }

    /*
     * Do not remove immediately.
     * Correct letter stays while
     * its voice is playing.
     */

    if(!correct){

        setTimeout(
            function(){

                obj.el.remove();

            },
            250
        );
    }
}

/* =========================================
   CORRECT
========================================= */

async function correctLetter(obj){

    clearInterval(timer);

    correctSound();

    score +=
        10 * level;

    showMessage(
        "GREAT!"
    );

    updateHUD();

    /*
     * Keep current letter
     * until its voice ends.
     */

    await playLetterSound(
        obj.base
    );

    if(!running)return;

    if(obj.el){

        obj.el.remove();
    }

    /*
     * Small pause after voice.
     */

    setTimeout(
        function(){

            nextRound();

        },
        250
    );
}

/* =========================================
   WRONG
========================================= */

function wrongLetter(){

    lives--;

    score =
        Math.max(
            0,
            score-5
        );

    wrongSound();

    showMessage(
        "WRONG!"
    );

    updateHUD();

    if(
        lives <= 0
    ){

        setTimeout(
            gameOver,
            500
        );
    }
}

/* =========================================
   BOMB HIT
========================================= */

function hitObstacle(obj){

    if(!running)return;

    lives--;

    score =
        Math.max(
            0,
            score-10
        );

    wrongSound();

    showMessage(
        "OUCH!"
    );

    obj.el.remove();

    obstacles =
        obstacles.filter(
            function(item){

                return item !== obj;

            }
        );

    updateHUD();

    if(
        lives <= 0
    ){

        setTimeout(
            gameOver,
            500
        );
    }
}

/* =========================================
   SLICE LINE
========================================= */

function drawSlice(
    x1,
    y1,
    x2,
    y2
){

    const line =
        document.createElement(
            "div"
        );

    line.className =
        "sliceLine";

    const dx =
        x2-x1;

    const dy =
        y2-y1;

    const length =
        Math.sqrt(
            dx*dx +
            dy*dy
        );

    if(length < 3)return;

    const angle =
        Math.atan2(
            dy,
            dx
        ) *
        180 /
        Math.PI;

    line.style.width =
        length + "px";

    line.style.left =
        x1 + "px";

    line.style.top =
        y1 + "px";

    line.style.transform =
        `rotate(${angle}deg)`;

    game.appendChild(line);

    setTimeout(
        function(){

            line.remove();

        },
        180
    );
}

/* =========================================
   MESSAGE
========================================= */

function showMessage(text){

    message.textContent =
        text;

    message.classList.remove(
        "pop"
    );

    void message.offsetWidth;

    message.classList.add(
        "pop"
    );
}

/* =========================================
   LOSE LIFE
========================================= */

function loseLife(reason){

    if(!running)return;

    lives--;

    wrongSound();

    showMessage(
        reason
    );

    updateHUD();

    if(
        lives <= 0
    ){

        setTimeout(
            gameOver,
            500
        );

    }else{

        setTimeout(
            nextRound,
            600
        );
    }
}

/* =========================================
   GAME OVER
========================================= */

function gameOver(){

    if(!running)return;

    running =
        false;

    clearInterval(timer);

    clearLetters();

    clearObstacles();

    gameOverSound();

    document.getElementById(
        "gameOverName"
    ).textContent =
        playerName;

    document.getElementById(
        "finalScore"
    ).textContent =
        score;

    document.getElementById(
        "finalLevel"
    ).textContent =
        level;

    gameOverScreen.classList.remove(
        "hidden"
    );
}

/* =========================================
   WIN
========================================= */

function winGame(){

    running =
        false;

    clearInterval(timer);

    clearLetters();

    clearObstacles();

    tone(
        523,
        .2,
        "square",
        .2
    );

    setTimeout(
        function(){

            tone(
                659,
                .2,
                "square",
                .2
            );

        },
        150
    );

    setTimeout(
        function(){

            tone(
                784,
                .3,
                "square",
                .2
            );

        },
        300
    );

    document.getElementById(
        "winName"
    ).textContent =
        "Great job, " +
        playerName +
        "!";

    document.getElementById(
        "winScore"
    ).textContent =
        score;

    winScreen.classList.remove(
        "hidden"
    );
}

/* =========================================
   CLEAR LETTERS
========================================= */

function clearLetters(){

    letters.forEach(
        function(obj){

            if(obj.el){

                obj.el.remove();
            }
        }
    );

    letters = [];
}

/* =========================================
   CLEAR BOMBS
========================================= */

function clearObstacles(){

    obstacles.forEach(
        function(obj){

            if(obj.el){

                obj.el.remove();
            }
        }
    );

    obstacles = [];
}

/* =========================================
   BUTTONS
========================================= */

document
.getElementById("startButton")
.addEventListener(
    "click",
    startGame
);

document
.getElementById("againButton")
.addEventListener(
    "click",
    startGame
);

document
.getElementById("winAgainButton")
.addEventListener(
    "click",
    startGame
);

/* =========================================
   ENTER
========================================= */

nameInput.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter"
        ){

            startGame();
        }
    }
);
