<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Ninja Alphabet Adventure</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:Arial,sans-serif;
}

body{
    background:#07111f;
}


/* =========================
   GAME
========================= */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 50% 15%,
        #294866 0%,
        #101c2c 50%,
        #050a12 100%
    );
}


/* =========================
   BACKGROUND
========================= */

.moon{
    position:absolute;

    width:80px;
    height:80px;

    right:8%;
    top:8%;

    border-radius:50%;

    background:#fff4bd;

    box-shadow:
    0 0 30px
    rgba(255,244,189,.7);
}

.star{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:white;

    opacity:.8;
}

.star1{left:7%;top:13%}
.star2{left:18%;top:27%}
.star3{left:31%;top:9%}
.star4{left:47%;top:18%}
.star5{left:63%;top:8%}
.star6{left:76%;top:28%}
.star7{left:88%;top:16%}
.star8{left:12%;top:43%}
.star9{left:38%;top:32%}
.star10{left:57%;top:38%}
.star11{left:92%;top:42%}


.ground{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:20%;

    background:
    linear-gradient(
        to bottom,
        #184526,
        #06170b
    );
}


/* =========================
   NINJA
========================= */

.ninja{
    position:absolute;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    width:130px;
    height:130px;

    z-index:30;

    pointer-events:none;
}

.ninja img{
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    filter:
    drop-shadow(
        0 7px 8px
        rgba(0,0,0,.55)
    );
}


/* =========================
   HUD
========================= */

#hud{
    position:absolute;

    top:8px;
    left:7px;
    right:7px;

    display:flex;

    justify-content:space-between;

    gap:4px;

    z-index:500;
}

.hudBox{
    background:white;

    color:#111;

    border:3px solid #111;

    border-radius:12px;

    padding:6px 9px;

    font-size:13px;

    font-weight:bold;

    box-shadow:
    0 4px 0
    rgba(0,0,0,.3);
}


/* =========================
   TARGET
========================= */

#targetBox{
    position:absolute;

    top:58px;
    left:50%;

    transform:
    translateX(-50%);

    z-index:500;

    background:white;

    border:4px solid #111;

    border-radius:18px;

    padding:4px 25px;

    text-align:center;

    box-shadow:
    0 5px 0
    rgba(0,0,0,.3);
}

#targetTitle{
    font-size:11px;

    font-weight:bold;

    color:#222;
}

#target{
    font-size:46px;

    line-height:48px;

    font-weight:900;

    color:#e63946;

    text-shadow:
    2px 2px 0 #222;
}


/* =========================
   PICTURE CIRCLES
========================= */

.letter{
    position:absolute;

    width:78px;
    height:78px;

    border-radius:50%;

    overflow:hidden;

    background:
    #ddd;

    border:4px solid white;

    box-shadow:
    0 7px 0
    rgba(0,0,0,.35),

    0 0 14px
    rgba(255,255,255,.25);

    z-index:100;

    user-select:none;

    -webkit-user-select:none;

    pointer-events:auto;
}

.letter img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    pointer-events:none;

    user-select:none;

    -webkit-user-select:none;
}


/* =========================
   HIT ANIMATION
========================= */

.hit{
    animation:
    hitAnimation .22s
    ease-out
    forwards;
}

@keyframes hitAnimation{

    0%{
        transform:
        scale(1);
    }

    50%{
        transform:
        scale(1.3)
        rotate(12deg);
    }

    100%{
        transform:
        scale(0);
    }
}


/* =========================
   BOMB
========================= */

.obstacle{
    position:absolute;

    width:62px;
    height:62px;

    object-fit:contain;

    z-index:150;

    pointer-events:none;

    filter:
    drop-shadow(
        0 5px 5px
        rgba(0,0,0,.55)
    );
}


/* =========================
   MESSAGE
========================= */

#message{
    position:absolute;

    left:50%;
    top:45%;

    transform:
    translate(-50%,-50%);

    z-index:700;

    font-size:48px;

    font-weight:900;

    color:white;

    text-shadow:
    4px 4px 0 #111;

    opacity:0;

    pointer-events:none;
}

.pop{
    animation:
    popAnimation .7s
    ease-out;
}

@keyframes popAnimation{

    0%{
        opacity:0;

        transform:
        translate(-50%,-50%)
        scale(.3);
    }

    35%{
        opacity:1;

        transform:
        translate(-50%,-50%)
        scale(1.2);
    }

    100%{
        opacity:0;

        transform:
        translate(-50%,-80%)
        scale(1);
    }
}


/* =========================
   SLICE LINE
========================= */

.sliceLine{
    position:absolute;

    height:7px;

    background:
    linear-gradient(
        to right,
        transparent,
        white,
        #baf5ff,
        white,
        transparent
    );

    border-radius:20px;

    box-shadow:
    0 0 8px white,
    0 0 18px #70eaff;

    pointer-events:none;

    z-index:800;

    animation:
    sliceFade .18s
    ease-out
    forwards;
}

@keyframes sliceFade{

    from{
        opacity:1;
    }

    to{
        opacity:0;
    }
}


/* =========================
   SCREENS
========================= */

.screen{
    position:absolute;

    inset:0;

    z-index:1000;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:20px;

    color:white;
}

.startScreen{
    background:
    radial-gradient(
        circle at center,
        #263b55,
        #08111f 70%
    );
}

.gameOverScreen{
    background:
    linear-gradient(
        135deg,
        #8b0000,
        #26000a
    );
}

.winScreen{
    background:
    linear-gradient(
        135deg,
        #00695c,
        #073b73
    );
}

.hidden{
    display:none !important;
}


/* =========================
   START SCREEN
========================= */

.screen h1{
    font-size:
    clamp(40px,10vw,65px);

    text-shadow:
    4px 4px 0 #111;
}

.screen h2{
    margin:8px 0;
}

.screen p{
    margin:5px;
}


#playerName{
    width:min(320px,85vw);

    padding:14px;

    margin:18px 0;

    border:3px solid #222;

    border-radius:15px;

    font-size:20px;

    text-align:center;

    color:#222;

    background:white;

    user-select:text;

    -webkit-user-select:text;

    touch-action:auto;
}


/* =========================
   BUTTON
========================= */

.gameButton{
    border:4px solid #222;

    border-radius:20px;

    background:#ffd43b;

    color:#222;

    padding:14px 32px;

    font-size:21px;

    font-weight:bold;

    box-shadow:
    0 7px 0 #9b7200;

    touch-action:manipulation;

    cursor:pointer;
}

.gameButton:active{
    transform:
    translateY(6px);

    box-shadow:
    0 1px 0 #9b7200;
}


/* =========================
   SMALL SCREEN
========================= */

@media(max-height:600px){

    #targetBox{
        top:48px;
    }

    .letter{
        width:68px;
        height:68px;
    }

    .obstacle{
        width:54px;
        height:54px;
    }

    .ninja{
        width:110px;
        height:110px;
    }

    .ninja img{
        width:110px;
        height:110px;
    }
}

</style>

</head>


<body>

<div class="star star7"></div>

<div
id="startScreen"

    <h1>

<script>

/* =====================================================
   ALPHABET
===================================================== */

const alphabet =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");


/* =====================================================
   ELEMENTS
===================================================== */

const game =
document.getElementById("game");

const startScreen =
document.getElementById("startScreen");

const gameOverScreen =
document.getElementById("gameOverScreen");

const winScreen =
document.getElementById("winScreen");

const playerNameInput =
document.getElementById("playerName");

const scoreElement =
document.getElementById("score");

const livesElement =
document.getElementById("lives");

const levelElement =
document.getElementById("level");

const timerElement =
document.getElementById("timer");

const targetElement =
document.getElementById("target");

const messageElement =
document.getElementById("message");


/* =====================================================
   GAME VARIABLES
===================================================== */

let score = 0;

let lives = 5;

let level = 1;

let round = 0;

let timeLeft = 10;

let currentTarget = "";

let playerName = "Ninja";

let running = false;

let timer = null;

let circles = [];

let obstacles = [];


/* =====================================================
   AUDIO VARIABLES
===================================================== */

let audioContext = null;

const letterSounds = {};


/* =====================================================
   PRELOAD ALL LETTER SOUNDS
===================================================== */

function preloadSounds(){

    alphabet.forEach(
        letter => {

            const audio =
            new Audio(
                "./" +
                letter +
                ".mp3"
            );

            /*
               مرورگر از قبل فایل را
               برای پخش سریع آماده می‌کند.
            */

            audio.preload = "auto";

            audio.load();

            letterSounds[letter] =
            audio;

        }
    );
}


/* =====================================================
   PLAY LETTER SOUND
===================================================== */

function playLetterSound(letter){

    const audio =
    letterSounds[letter];

    if(!audio){
        return;
    }

    /*
       از ابتدای فایل پخش شود
    */

    audio.currentTime = 0;

    audio.play().catch(
        () => {}
    );
}


/* =====================================================
   AUDIO CONTEXT
===================================================== */

function initAudio(){

    if(!audioContext){

        const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

        if(AudioContext){

            audioContext =
            new AudioContext();

        }

    }

    if(
        audioContext &&
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }
}


/* =====================================================
   SIMPLE SOUND
===================================================== */

function tone(
    frequency,
    duration,
    type="sine",
    volume=.25
){

    if(!audioContext){
        return;
    }

    const oscillator =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();


    oscillator.type =
    type;

    oscillator.frequency.value =
    frequency;


    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime +
        duration
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime +
        duration
    );
}


/* =====================================================
   SOUND EFFECTS
===================================================== */

function sliceSound(){

    tone(
        1600,
        .1,
        "sawtooth",
        .25
    );
}


function correctSound(){

    tone(
        600,
        .1,
        "square",
        .2
    );

    setTimeout(
        () => {

            tone(
                900,
                .14,
                "square",
                .2
            );

        },
        100
    );
}


function wrongSound(){

    tone(
        120,
        .3,
        "sawtooth",
        .3
    );
}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    initAudio();


    playerName =
    playerNameInput.value.trim()
    ||
    "Ninja";


    score = 0;

    lives = 5;

    level = 1;

    round = 0;

    timeLeft = 10;

    running = true;


    clearInterval(timer);


    clearAll();


    startScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );

    winScreen.classList.add(
        "hidden"
    );


    updateHUD();


    nextRound();
}


/* =====================================================
   NEXT ROUND
===================================================== */

function nextRound(){

    if(!running){
        return;
    }


    /*
       تایمر قبلی حتماً متوقف شود
    */

    clearInterval(timer);


    /*
       اشیای قبلی پاک شوند
    */

    clearAll();


    /*
       آیا 26 حرف تمام شده؟
    */

    if(round >= 26){

        winGame();

        return;
    }


    /*
       هدف فعلی
    */

    currentTarget =
    alphabet[round];


    targetElement.textContent =
    currentTarget;


    /*
       Level
    */

    level =
    Math.min(
        10,
        Math.floor(
            round / 5
        ) + 1
    );


    /*
       زمان راند
    */

    timeLeft =
    Math.max(
        5,
        11 - level
    );


    /*
       ساخت تصاویر
    */

    createPictures();


    /*
       ساخت بمب
    */

    createBombs();


    /*
       راند بعدی
    */

    round++;


    updateHUD();


    /*
       شروع تایمر جدید
    */

    startTimer();
}


/* =====================================================
   CREATE PICTURES
===================================================== */

function createPictures(){

    /*
       حداقل 6 تصویر
    */

    const count =
    Math.min(
        6 +
        Math.floor(
            level / 2
        ),
        10
    );


    let selected = [];


    /*
       Target حتماً باشد
    */

    selected.push(
        currentTarget
    );


    /*
       تصاویر اشتباه
    */

    while(
        selected.length <
        count
    ){

        const randomLetter =
        alphabet[
            Math.floor(
                Math.random() *
                alphabet.length
            )
        ];


        if(
            !selected.includes(
                randomLetter
            )
        ){

            selected.push(
                randomLetter
            );

        }

    }


    /*
       مخلوط کردن
    */

    selected.sort(
        () =>
        Math.random() - .5
    );


    /*
       ساخت تک تک تصاویر
    */

    selected.forEach(
        (letter,index) => {

            createPicture(
                letter
            );

        }
    );
}


/* =====================================================
   CREATE ONE PICTURE
===================================================== */

function createPicture(letter){

    const div =
    document.createElement(
        "div"
    );


    div.className =
    "letter";


    /*
       تصویر
    */

    const img =
    document.createElement(
        "img"
    );


    img.src =
    "./" +
    letter +
    ".jpg";


    img.alt = "";


    /*
       اگر عکس پیدا نشد
       دایره حذف شود.
    */

    img.onerror =
    function(){

        console.warn(
            "Image not found:",
            letter
        );

        div.remove();

    };


    div.appendChild(img);


    game.appendChild(div);


    /*
       موقعیت تصادفی
    */

    let x = 0;

    let y = 0;

    let attempts = 0;


    do{

        x =
        10 +
        Math.random() *
        (
            window.innerWidth -
            100
        );


        y =
        150 +
        Math.random() *
        Math.max(
            40,
            window.innerHeight -
            260
        );


        attempts++;

    }
    while(
        isTooClose(
            x,
            y
        )
        &&
        attempts < 100
    );


    const obj = {

        el:div,

        letter:letter,

        x:x,

        y:y,

        vx:
        (
            Math.random() <
            .5
            ? -1
            : 1
        )
        *
        (
            .45 +
            Math.random() *
            .7
        ),

        vy:
        (
            Math.random() <
            .5
            ? -1
            : 1
        )
        *
        (
            .4 +
            Math.random() *
            .6
        ),

        rotation:
        Math.random() *
        360,

        vr:
        (
            Math.random() -
            .5
        ) * 2,

        alive:true

    };


    circles.push(obj);


    div.style.transform =
    `translate(
        ${x}px,
        ${y}px
    )`;
}


/* =====================================================
   CHECK DISTANCE
===================================================== */

function isTooClose(
    x,
    y
){

    for(
        const obj of circles
    ){

        const distance =
        Math.hypot(
            x - obj.x,
            y - obj.y
        );


        if(
            distance < 90
        ){

            return true;

        }

    }


    return false;
}


/* =====================================================
   CREATE BOMBS
===================================================== */

function createBombs(){

    const count =
    Math.min(
        level,
        3
    );


    for(
        let i = 0;
        i < count;
        i++
    ){

        const img =
        document.createElement(
            "img"
        );


        img.className =
        "obstacle";


        img.src =
        "./bomb.jpg";


        img.alt = "";


        const obj = {

            el:img,

            x:
            20 +
            Math.random() *
            Math.max(
                20,
                window.innerWidth -
                90
            ),

            y:
            170 +
            Math.random() *
            Math.max(
                30,
                window.innerHeight -
                310
            ),

            vx:
            (
                Math.random() <
                .5
                ? -1
                : 1
            )
            *
            (
                .5 +
                level *
                .05
            ),

            vy:
            (
                Math.random() <
                .5
                ? -1
                : 1
            )
            *
            (
                .4 +
                level *
                .04
            ),

            rotation:0,

            vr:
            (
                Math.random() -
                .5
            ) * 4

        };


        game.appendChild(img);


        obstacles.push(obj);

    }
}


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    if(running){

        const width =
        window.innerWidth;

        const height =
        window.innerHeight;


        /*
           تصاویر
        */

        circles.forEach(
            obj => {

                if(
                    !obj.alive
                ){
                    return;
                }


                obj.x +=
                obj.vx;


                obj.y +=
                obj.vy;


                obj.rotation +=
                obj.vr;


                /*
                   برخورد با چپ و راست
                */

                if(
                    obj.x <= 5 ||
                    obj.x >=
                    width - 83
                ){

                    obj.vx *= -1;

                }


                /*
                   برخورد بالا و پایین
                */

                if(
                    obj.y <= 135 ||
                    obj.y >=
                    height - 170
                ){

                    obj.vy *= -1;

                }


                obj.el.style.transform =
                `translate(
                    ${obj.x}px,
                    ${obj.y}px
                )
                rotate(
                    ${obj.rotation}deg
                )`;

            }
        );


        /*
           بمب‌ها
        */

        obstacles.forEach(
            obj => {

                obj.x +=
                obj.vx;


                obj.y +=
                obj.vy;


                obj.rotation +=
                obj.vr;


                if(
                    obj.x <= 5 ||
                    obj.x >=
                    width - 70
                ){

                    obj.vx *= -1;

                }


                if(
                    obj.y <= 135 ||
                    obj.y >=
                    height - 175
                ){

                    obj.vy *= -1;

                }


                obj.el.style.transform =
                `translate(
                    ${obj.x}px,
                    ${obj.y}px
                )
                rotate(
                    ${obj.rotation}deg
                )`;

            }
        );

    }


    requestAnimationFrame(
        animate
    );
}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    clearInterval(timer);


    timer =
    setInterval(
        () => {

            if(!running){

                clearInterval(timer);

                return;
            }


            timeLeft--;


            if(
                timeLeft < 0
            ){

                timeLeft = 0;

            }


            updateHUD();


            /*
               تایمر تمام شد
            */

            if(
                timeLeft === 0
            ){

                clearInterval(timer);


                loseLife(
                    "TIME'S UP!"
                );

            }

        },
        1000
    );
}


/* =====================================================
   LOSE LIFE
===================================================== */

function loseLife(reason){

    if(!running){
        return;
    }


    /*
       تایمر حتماً متوقف شود
    */

    clearInterval(timer);


    lives--;


    wrongSound();


    showMessage(
        reason
    );


    updateHUD();


    /*
       اگر جان تمام شد
    */

    if(
        lives <= 0
    ){

        setTimeout(
            () => {

                if(running){

                    gameOver();

                }

            },
            600
        );


        return;
    }


    /*
       اگر هنوز جان داریم
       راند بعدی
    */

    setTimeout(
        () => {

            if(running){

                nextRound();

            }

        },
        700
    );
}


/* =====================================================
   POINTER
===================================================== */

let lastX = 0;

let lastY = 0;


game.addEventListener(
    "pointerdown",
    event => {

        if(
            !running
        ){
            return;
        }


        if(
            event.target.closest(
                "button"
            )
        ){

            return;

        }


        if(
            event.target.tagName ===
            "INPUT"
        ){

            return;

        }


        lastX =
        event.clientX;

        lastY =
        event.clientY;


        checkCollision(
            event.clientX,
            event.clientY
        );

    }
);


game.addEventListener(
    "pointermove",
    event => {

        if(
            !running
        ){
            return;
        }


        drawSlice(
            lastX,
            lastY,
            event.clientX,
            event.clientY
        );


        lastX =
        event.clientX;

        lastY =
        event.clientY;


        checkCollision(
            event.clientX,
            event.clientY
        );

    }
);


/* =====================================================
   COLLISION
===================================================== */

function checkCollision(
    x,
    y
){

    /*
       تصاویر
    */

    for(
        const obj of circles
    ){

        if(
            !obj.alive
        ){
            continue;
        }


        const rect =
        obj.el.getBoundingClientRect();


        const centerX =
        rect.left +
        rect.width / 2;


        const centerY =
        rect.top +
        rect.height / 2;


        const distance =
        Math.hypot(
            x - centerX,
            y - centerY
        );


        if(
            distance <
            rect.width / 2
        ){

            slicePicture(
                obj
            );

            return;

        }

    }


    /*
       بمب
    */

    for(
        const obj of obstacles
    ){

        if(
            !obj.el.parentNode
        ){
            continue;
        }


        const rect =
        obj.el.getBoundingClientRect();


        const centerX =
        rect.left +
        rect.width / 2;


        const centerY =
        rect.top +
        rect.height / 2;


        const distance =
        Math.hypot(
            x - centerX,
            y - centerY
        );


        if(
            distance <
            rect.width / 2
        ){

            hitBomb(
                obj
            );

            return;

        }

    }
}


/* =====================================================
   SLICE PICTURE
===================================================== */

function slicePicture(
    obj
){

    if(
        !obj.alive
    ){
        return;
    }


    obj.alive = false;


    sliceSound();


    obj.el.classList.add(
        "hit"
    );


    const correct =
    obj.letter ===
    currentTarget;


    if(correct){

        correctAnswer();

    }
    else{

        wrongAnswer();

    }


    setTimeout(
        () => {

            if(obj.el){

                obj.el.remove();

            }

        },
        220
    );
}


/* =====================================================
   CORRECT ANSWER
===================================================== */

function correctAnswer(){

    /*
       تایمر متوقف
    */

    clearInterval(timer);


    /*
       امتیاز
    */

    score +=
    10 * level;


    correctSound();


    showMessage(
        "GREAT!"
    );


    updateHUD();


    /*
       صدای حرف
       فوراً پخش می‌شود
    */

    playLetterSound(
        currentTarget
    );


    /*
       راند بعدی
    */

    setTimeout(
        () => {

            if(running){

                nextRound();

            }

        },
        700
    );
}


/* =====================================================
   WRONG ANSWER
===================================================== */

function wrongAnswer(){

    lives--;


    score =
    Math.max(
        0,
        score - 5
    );


    wrongSound();


    showMessage(
        "WRONG!"
    );


    updateHUD();


    if(
        lives <= 0
    ){

        setTimeout(
            () => {

                if(running){

                    gameOver();

                }

            },
            500
        );

    }
}


/* =====================================================
   BOMB HIT
===================================================== */

function hitBomb(
    obj
){

    if(
        !running
    ){
        return;
    }


    lives--;


    score =
    Math.max(
        0,
        score - 10
    );


    wrongSound();


    showMessage(
        "OUCH!"
    );


    obj.el.remove();


    obstacles =
    obstacles.filter(
        item =>
        item !== obj
    );


    updateHUD();


    if(
        lives <= 0
    ){

        setTimeout(
            () => {

                if(running){

                    gameOver();

                }

            },
            500
        );

    }
}


/* =====================================================
   SLICE LINE
===================================================== */

function drawSlice(
    x1,
    y1,
    x2,
    y2
){

    const dx =
    x2 - x1;

    const dy =
    y2 - y1;


    const length =
    Math.sqrt(
        dx * dx +
        dy * dy
    );


    if(
        length < 3
    ){
        return;
    }


    const line =
    document.createElement(
        "div"
    );


    line.className =
    "sliceLine";


    const angle =
    Math.atan2(
        dy,
        dx
    )
    *
    180 /
    Math.PI;


    line.style.width =
    length + "px";


    line.style.left =
    x1 + "px";


    line.style.top =
    y1 + "px";


    line.style.transform =
    `rotate(${angle}deg)`;


    game.appendChild(
        line
    );


    setTimeout(
        () => {

            line.remove();

        },
        180
    );
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text
){

    messageElement.textContent =
    text;


    messageElement.classList.remove(
        "pop"
    );


    void messageElement.offsetWidth;


    messageElement.classList.add(
        "pop"
    );
}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    scoreElement.textContent =
    score;


    livesElement.textContent =
    lives;


    levelElement.textContent =
    level;


    timerElement.textContent =
    timeLeft;
}


/* =====================================================
   CLEAR ALL
===================================================== */

function clearAll(){

    circles.forEach(
        obj => {

            if(obj.el){

                obj.el.remove();

            }

        }
    );


    obstacles.forEach(
        obj => {

            if(obj.el){

                obj.el.remove();

            }

        }
    );


    circles = [];

    obstacles = [];
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    if(
        !running
    ){
        return;
    }


    running = false;


    clearInterval(timer);


    clearAll();


    document.getElementById(
        "gameOverName"
    ).textContent =
    playerName;


    document.getElementById(
        "finalScore"
    ).textContent =
    score;


    document.getElementById(
        "finalLevel"
    ).textContent =
    level;


    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =====================================================
   WIN
===================================================== */

function winGame(){

    running = false;


    clearInterval(timer);


    clearAll();


    tone(
        523,
        .2,
        "square",
        .2
    );


    setTimeout(
        () => {

            tone(
                659,
                .2,
                "square",
                .2
            );

        },
        150
    );


    setTimeout(
        () => {

            tone(
                784,
                .3,
                "square",
                .2
            );

        },
        300
    );


    document.getElementById(
        "winName"
    ).textContent =
    "Great job, " +
    playerName +
    "!";


    document.getElementById(
        "winScore"
    ).textContent =
    score;


    winScreen.classList.remove(
        "hidden"
    );
}


/* =====================================================
   BUTTONS
===================================================== */

document
.getElementById(
    "startButton"
)
.addEventListener(
    "click",
    startGame
);


document
.getElementById(
    "againButton"
)
.addEventListener(
    "click",
    startGame
);


document
.getElementById(
    "winAgainButton"
)
.addEventListener(
    "click",
    startGame
);


/* =====================================================
   ENTER KEY
===================================================== */

playerNameInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            startGame();

        }

    }
);


/* =====================================================
   PRELOAD SOUNDS
===================================================== */

preloadSounds();


/* =====================================================
   START ANIMATION
===================================================== */

animate();

</script>
